<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>학생용 AI 심문실</title>
  <script src="auth.js" defer></script>
  <script src="presence.js?v=manual-presence-3" defer></script>
  <script src="ethics-quiz.js" defer></script>
  <script src="token-estimator.js" defer></script>
  <script src="student-interrogation.js" defer></script>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at 16% 10%, rgba(47, 110, 234, 0.2), transparent 30%),
        linear-gradient(135deg, #0d1522 0%, #172235 52%, #202436 100%);
      color: #18202b;
      font-family: "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
      letter-spacing: 0;
    }

    .page {
      width: min(1280px, 100%);
      margin: 0 auto;
      padding: 24px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 18px;
      color: #fff;
    }

    h1 {
      margin: 0;
      font-size: 1.7rem;
      line-height: 1.2;
    }

    .topbar p {
      margin: 6px 0 0;
      color: rgba(255, 255, 255, 0.76);
      font-weight: 800;
    }

    .logout-btn {
      min-height: 38px;
      border: 0;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.14);
      color: #fff;
      cursor: pointer;
      padding: 8px 12px;
      font: inherit;
      font-weight: 900;
    }

    .receive-credit-btn {
      min-height: 38px;
      border: 0;
      border-radius: 6px;
      background: #dc342f;
      color: #fff;
      cursor: pointer;
      padding: 8px 12px;
      font: inherit;
      font-weight: 950;
      box-shadow: 0 10px 24px rgba(220, 52, 47, 0.24);
    }

    .evidence-code-form {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 8px;
    }

    .evidence-code-input {
      min-width: 0;
      min-height: 38px;
      border: 1px solid rgba(231, 189, 73, 0.42);
      border-radius: 7px;
      background: rgba(255, 255, 255, 0.96);
      color: #18202b;
      padding: 8px 10px;
      font: inherit;
      font-weight: 850;
      text-transform: uppercase;
    }

    .evidence-code-input:focus {
      border-color: #e1ae2d;
      box-shadow: 0 0 0 3px rgba(225, 174, 45, 0.16);
      outline: none;
    }

    .evidence-code-message {
      min-height: 18px;
      margin: -3px 0 0;
      color: rgba(255, 255, 255, 0.72);
      font-size: 0.78rem;
      line-height: 1.35;
      font-weight: 850;
    }

    .evidence-code-message.is-ok {
      color: #8ee0b2;
    }

    .evidence-code-message.is-bad {
      color: #ffafa9;
    }

    .receive-credit-btn:hover,
    .receive-credit-btn:focus-visible {
      background: #b82924;
      outline: none;
    }

    .presence-refresh-btn {
      min-height: 38px;
      border: 0;
      border-radius: 6px;
      background: #eef1f5;
      color: #18202b;
      cursor: pointer;
      padding: 8px 12px;
      font: inherit;
      font-weight: 950;
      white-space: nowrap;
    }

    .presence-refresh-btn:hover,
    .presence-refresh-btn:focus-visible {
      background: #dfe5ec;
      outline: none;
    }

    .presence-refresh-btn:disabled {
      cursor: wait;
      opacity: 0.62;
    }

    .student-tools {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .credit-pill {
      min-height: 38px;
      display: flex;
      align-items: center;
      gap: 8px;
      border: 1px solid rgba(255, 255, 255, 0.26);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.12);
      color: #fff;
      padding: 8px 11px;
      font-weight: 950;
    }

    .credit-pill span {
      color: rgba(255, 255, 255, 0.72);
      font-size: 0.84rem;
    }

    .student-log-card {
      margin-top: 18px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.96);
      border: 1px solid rgba(255, 255, 255, 0.62);
      box-shadow: 0 18px 50px rgba(0, 0, 0, 0.26);
      padding: 16px;
    }

    .student-log-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
    }

    .student-log-head h2 {
      margin: 0;
      color: #18202b;
      font-size: 1.08rem;
      line-height: 1.2;
    }

    .student-log-head strong {
      color: #c92521;
      font-size: 0.95rem;
      font-weight: 950;
    }

    .student-log-actions {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
      flex-wrap: wrap;
    }

    .student-log-list {
      display: grid;
      gap: 8px;
      max-height: 230px;
      overflow-y: auto;
    }

    .student-log-entry {
      border: 1px solid #e1e8f0;
      border-radius: 8px;
      background: #fbfdff;
      padding: 10px;
    }

    .student-log-entry span {
      display: block;
      color: #657181;
      font-size: 0.78rem;
      font-weight: 900;
    }

    .student-log-entry p,
    .student-log-empty {
      margin: 5px 0 0;
      color: #18202b;
      font-size: 0.9rem;
      line-height: 1.42;
      font-weight: 800;
    }

    .student-log-empty {
      margin: 0;
      color: #657181;
    }

    .presence-list {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 8px;
    }

    .presence-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      min-height: 40px;
      border: 1px solid #e1e8f0;
      border-radius: 8px;
      background: #fbfdff;
      padding: 8px 10px;
      font-weight: 950;
    }

    .presence-name {
      min-width: 0;
      color: #18202b;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .presence-role {
      flex: 0 0 auto;
      border-radius: 999px;
      background: #e9eef5;
      color: #516071;
      padding: 3px 7px;
      font-size: 0.74rem;
      font-weight: 950;
    }

    .presence-empty {
      grid-column: 1 / -1;
      margin: 0;
      color: #657181;
      font-weight: 850;
    }

    .suspect-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 18px;
      align-items: start;
    }

    .suspect-column {
      display: grid;
      gap: 12px;
      min-width: 0;
    }

    .suspect-card,
    .note-card {
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.96);
      border: 1px solid rgba(255, 255, 255, 0.62);
      box-shadow: 0 18px 50px rgba(0, 0, 0, 0.32);
      overflow: hidden;
    }

    .suspect-card {
      display: grid;
      grid-template-rows: auto 1fr;
      color: inherit;
      text-decoration: none;
    }

    .suspect-card:hover,
    .suspect-card:focus-visible {
      outline: 3px solid rgba(243, 52, 47, 0.48);
      outline-offset: 3px;
    }

    .suspect-card img {
      width: 100%;
      aspect-ratio: 1 / 1;
      object-fit: contain;
      object-position: center;
      background: #dfe6ef;
      padding: 18px;
    }

    .suspect-info {
      padding: 18px;
    }

    .suspect-info h2,
    .note-card h3 {
      margin: 0 0 8px;
      line-height: 1.2;
    }

    .suspect-info h2 {
      font-size: 1.34rem;
    }

    .suspect-info p {
      margin: 0;
      color: #657181;
      font-weight: 800;
      line-height: 1.45;
    }

    .note-card {
      padding: 14px;
    }

    .note-card h3 {
      color: #18202b;
      font-size: 1.08rem;
    }

    .note-area {
      width: 100%;
      min-height: 260px;
      border: 1px solid #cfd8e4;
      border-radius: 8px;
      background:
        linear-gradient(#fff 31px, #e8eef6 32px),
        #fff;
      background-size: 100% 32px;
      color: #18202b;
      padding: 10px 12px;
      resize: vertical;
      font: inherit;
      font-weight: 750;
      line-height: 32px;
    }

    .note-area:focus {
      border-color: #f3342f;
      box-shadow: 0 0 0 3px rgba(243, 52, 47, 0.14);
      outline: none;
    }

    .note-tools {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-top: 10px;
      color: #657181;
      font-size: 0.88rem;
      font-weight: 900;
    }

    .clear-note {
      min-height: 32px;
      border: 0;
      border-radius: 6px;
      background: #e9eef5;
      color: #344154;
      cursor: pointer;
      padding: 6px 10px;
      font: inherit;
      font-weight: 900;
    }

    .clear-note:hover,
    .clear-note:focus-visible {
      background: #dfe6ef;
      outline: none;
    }

    .science-mission-card {
      display: grid;
      grid-template-columns: minmax(260px, 1.25fr) minmax(240px, 0.75fr);
      gap: 0;
      margin-top: 18px;
      border-radius: 8px;
      overflow: hidden;
      background: rgba(255, 255, 255, 0.96);
      border: 1px solid rgba(255, 255, 255, 0.62);
      box-shadow: 0 18px 50px rgba(0, 0, 0, 0.26);
      color: inherit;
      text-decoration: none;
    }

    .science-mission-card:hover,
    .science-mission-card:focus-visible {
      outline: 3px solid rgba(243, 52, 47, 0.48);
      outline-offset: 3px;
    }

    .science-mission-card img {
      width: 100%;
      height: 100%;
      min-height: 230px;
      object-fit: cover;
      object-position: center;
      background: #dfe6ef;
    }

    .science-mission-info {
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 24px;
    }

    .science-mission-info h2 {
      margin: 0 0 10px;
      color: #18202b;
      font-size: 1.5rem;
      line-height: 1.2;
    }

    .science-mission-info p {
      margin: 0;
      color: #657181;
      font-weight: 850;
      line-height: 1.45;
    }

    .student-ethics-card {
      display: grid;
      gap: 14px;
      border-radius: 8px;
      background: rgba(255, 250, 240, 0.98);
      border: 1px solid rgba(225, 174, 45, 0.58);
      box-shadow: 0 18px 50px rgba(0, 0, 0, 0.26);
      padding: 16px;
    }

    .student-ethics-card[hidden] {
      display: none;
    }

    .student-ethics-head {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: start;
      border-bottom: 1px solid #e2d6b7;
      padding-bottom: 12px;
    }

    .student-ethics-kicker {
      margin: 0 0 5px;
      color: #a2201c;
      font-size: 0.82rem;
      font-weight: 950;
    }

    .student-ethics-head h2 {
      margin: 0;
      color: #22170e;
      font-size: 1.28rem;
      line-height: 1.25;
      font-weight: 950;
    }

    .student-ethics-meta {
      flex: 0 0 auto;
      border-radius: 999px;
      background: #f0e5d0;
      color: #4a3724;
      padding: 6px 10px;
      font-size: 0.82rem;
      font-weight: 950;
    }

    .student-ethics-source {
      display: grid;
      justify-items: center;
      gap: 8px;
      border: 1px solid #e2d6b7;
      border-radius: 8px;
      background: #fff;
      padding: 12px;
    }

    .student-ethics-question-layout {
      display: grid;
      grid-template-columns: minmax(280px, 0.9fr) minmax(360px, 1.1fr);
      gap: 16px;
      align-items: start;
    }

    .student-ethics-question-layout .student-ethics-source {
      position: sticky;
      top: 14px;
      align-self: start;
    }

    .student-ethics-source img {
      display: block;
      width: 100%;
      max-width: 100%;
      height: auto;
      max-height: none;
      object-fit: contain;
      object-position: center;
      border: 1px solid #e3ddcf;
      border-radius: 6px;
      background: #f8f4ec;
    }

    .student-ethics-source span {
      color: #655748;
      font-size: 0.78rem;
      font-weight: 850;
    }

    .student-ethics-source-empty {
      width: 100%;
      border: 1px dashed #d9ccb6;
      border-radius: 7px;
      background: #fbf6eb;
      padding: 18px;
      text-align: center;
    }

    .student-ethics-copy {
      display: grid;
      gap: 12px;
    }

    .student-ethics-section {
      display: grid;
      gap: 8px;
    }

    .student-ethics-section h3 {
      margin: 0;
      color: #7f1715;
      font-size: 0.9rem;
      font-weight: 950;
    }

    .student-ethics-section p {
      margin: 0;
      color: #2a2118;
      line-height: 1.58;
      font-weight: 780;
    }

    .student-ethics-prompt {
      border-left: 4px solid #d82923;
      border-radius: 6px;
      background: #fff;
      padding: 12px 13px;
    }

    .student-ethics-options {
      display: grid;
      gap: 8px;
    }

    .student-ethics-option {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr);
      gap: 10px;
      align-items: start;
      border: 1px solid #e2d6b7;
      border-radius: 8px;
      background: #fff;
      padding: 11px 12px;
      color: #24180f;
      cursor: pointer;
      font-weight: 800;
    }

    .student-ethics-option input {
      margin-top: 3px;
      accent-color: #d82923;
    }

    .student-ethics-option.is-selected {
      border-color: #d82923;
      box-shadow: inset 4px 0 0 #d82923;
    }

    .student-ethics-option.is-correct {
      border-color: #148a5b;
      box-shadow: inset 4px 0 0 #148a5b;
    }

    .student-ethics-option.is-wrong {
      border-color: #d82923;
      background: #fff6f5;
      box-shadow: inset 4px 0 0 #d82923;
    }

    .student-ethics-option.is-locked {
      cursor: not-allowed;
      opacity: 0.88;
    }

    .student-ethics-actions {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
    }

    .student-ethics-next {
      min-height: 40px;
      border-radius: 7px;
      background: #24180f;
      color: #fffaf0;
      padding: 9px 13px;
      font-weight: 950;
    }

    .student-ethics-next:hover,
    .student-ethics-next:focus-visible {
      background: #3a281a;
      outline: none;
    }

    .student-ethics-submit {
      min-height: 40px;
      border-radius: 7px;
      background: #d82923;
      color: #fff;
      padding: 9px 13px;
      font-weight: 950;
    }

    .student-ethics-submit:hover,
    .student-ethics-submit:focus-visible {
      background: #b3221d;
      outline: none;
    }

    .student-ethics-submit:disabled {
      cursor: not-allowed;
      background: #e1d2a9;
      color: #655748;
      opacity: 0.8;
    }

    .student-ethics-status {
      min-height: 24px;
      color: #655748;
      font-weight: 950;
    }

    .student-ethics-status.is-ok {
      color: #116c46;
    }

    .student-ethics-status.is-bad {
      color: #b3221d;
    }

    .student-ethics-explanation {
      display: none;
      gap: 8px;
      border: 1px solid #d7e3d8;
      border-radius: 8px;
      background: #f6fbf5;
      padding: 12px 13px;
    }

    .student-ethics-explanation.is-visible {
      display: grid;
    }

    @media (max-width: 980px) {
      .student-ethics-question-layout {
        grid-template-columns: 1fr;
      }

      .student-ethics-question-layout .student-ethics-source {
        position: static;
      }
    }

    @media (max-width: 980px) {
      .suspect-grid {
        grid-template-columns: 1fr;
      }

      .presence-list {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .suspect-card {
        grid-template-columns: 180px minmax(0, 1fr);
      }

      .suspect-card img {
        height: 100%;
        aspect-ratio: auto;
      }

      .science-mission-card {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 640px) {
      .page {
        padding: 14px;
      }

      .topbar {
        align-items: start;
        flex-direction: column;
      }

      .suspect-card {
        grid-template-columns: 1fr;
      }

      .note-area {
        min-height: 220px;
      }

      .presence-list {
        grid-template-columns: 1fr;
      }
    }

    body {
      background:
        radial-gradient(circle at 18% 12%, rgba(157, 47, 38, 0.24), transparent 28%),
        linear-gradient(135deg, #120f0c 0%, #24180f 45%, #18202b 100%);
    }

    button,
    input,
    textarea {
      font: inherit;
    }

    button {
      border: 0;
      cursor: pointer;
    }

    .page {
      width: min(1760px, 100%);
      padding: 18px;
    }

    .topbar {
      margin-bottom: 14px;
    }

    .topbar h1 {
      font-size: 1.45rem;
      font-weight: 950;
    }

    .student-workspace {
      display: grid;
      grid-template-columns: 268px minmax(0, 1fr);
      gap: 16px;
      align-items: start;
    }

    .student-menu {
      position: sticky;
      top: 18px;
      display: grid;
      gap: 12px;
      padding: 14px;
      border: 1px solid rgba(225, 174, 45, 0.58);
      border-radius: 8px;
      background: rgba(19, 12, 7, 0.86);
      box-shadow: 0 16px 42px rgba(0, 0, 0, 0.32);
      color: #fff;
      /* 메뉴 내용이 화면보다 길면(예: 1366x768) 로그아웃 등 아래쪽 버튼이 화면 밖으로
         밀린다. 메뉴 자체를 뷰포트 높이에 맞춰 내부 스크롤하게 해, 어떤 세로 높이에서도
         모든 버튼에 도달할 수 있게 한다. (좁은 화면에서 static으로 바뀔 때는 아래 반응형에서 해제) */
      max-height: calc(100dvh - 36px);
      overflow-y: auto;
    }

    .student-menu-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      color: #e1ae2d;
      font-size: 0.82rem;
      font-weight: 950;
      letter-spacing: 0;
    }

    .student-class-badge {
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(225, 174, 45, 0.4);
      padding: 2px 7px;
      color: #fff;
      font-size: 0.72rem;
    }

    /* 2단: 왼쪽 용의자 영역 + 오른쪽 340px 증거 보관함, 유사도 배너는 아래 전체 폭.
       (심문 노트를 없앤 340px 자리를 증거 보관함으로 되살려 균형을 맞춘다.) */
    .student-main {
      min-width: 0;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 340px;
      grid-template-areas:
        "content vault"
        "banner banner";
      gap: 16px;
      align-items: start;
    }

    .student-content {
      grid-area: content;
      min-width: 0;
      display: grid;
      gap: 16px;
    }

    .student-main > .evidence-vault-card {
      grid-area: vault;
      /* 오른쪽 칸 상단 고정: 스크롤 없이 항상 보이게 한다. */
      position: sticky;
      top: 18px;
    }

    .student-main > .case-note-button {
      grid-area: banner;
    }

    .credit-pill {
      min-height: 36px;
      border-color: rgba(231, 189, 73, 0.42);
      background: rgba(255, 255, 255, 0.1);
      padding: 7px 10px;
    }

    .student-tools {
      display: grid;
      gap: 9px;
      align-items: stretch;
    }

    .student-tools .credit-pill {
      justify-content: space-between;
      width: 100%;
    }

    .student-tools button {
      width: 100%;
      justify-content: center;
    }

    .ethics-quiz-tile {
      min-height: 86px;
      display: grid;
      place-items: center;
      gap: 4px;
      border: 1px solid rgba(231, 189, 73, 0.62);
      border-radius: 8px;
      background:
        linear-gradient(180deg, rgba(255, 248, 225, 0.16), rgba(185, 31, 31, 0.16)),
        rgba(255, 255, 255, 0.08);
      color: #fff;
      text-decoration: none;
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.08);
      transition: transform 0.16s ease, border-color 0.16s ease, background 0.16s ease, box-shadow 0.16s ease;
    }

    .ethics-quiz-tile:hover,
    .ethics-quiz-tile:focus-visible {
      border-color: #e1ae2d;
      background:
        linear-gradient(180deg, rgba(255, 248, 225, 0.24), rgba(185, 31, 31, 0.22)),
        rgba(255, 255, 255, 0.12);
      box-shadow: 0 0 0 3px rgba(225, 174, 45, 0.18);
      outline: none;

    .suspect-card {
      position: relative;
      display: grid;
      place-items: center;
      margin: 0;
      width: 100%;
      min-height: 0;
      height: auto;
      /* 카드 이미지는 사진+이름+설명이 세로로 구워져 있다. 상단 ~53%(이름 배너+사진)만
         보이도록 비율을 줄여 설명 패널을 잘라낸다(클릭 시 라이트박스에서 전체가 보임).
         카드 세로가 짧아진 만큼 아래 채팅창이 커진다. */
      aspect-ratio: 1 / 1.05;
      border-radius: 8px;
      overflow: hidden;
      background: #000;
      border: 1px solid rgba(225, 174, 45, 0.58);
      box-shadow: 0 16px 44px rgba(0, 0, 0, 0.34);

    /* teacher.html의 case-note-button 배너 스타일을 학생 화면에도 복사해 톤을 맞춘다.
       (두 파일이 각자 스타일을 가지는 구조라 복사가 불가피). 교사용은 <a> 링크,
       학생용은 팝업을 여는 <button>이라 버튼용 기본값(width/text-align/cursor)을 더한다. */
    .case-note-button {
      position: relative;
      width: 100%;
      display: grid;
      grid-template-columns: 86px minmax(0, 1fr) 210px;
      align-items: center;
      min-height: 116px;
      overflow: hidden;
      border: 1px solid rgba(231, 196, 134, 0.58);
      border-radius: 8px;
      background:
        linear-gradient(90deg, rgba(31, 25, 21, 0.96) 0%, rgba(70, 47, 32, 0.95) 48%, rgba(229, 202, 156, 0.96) 100%);
      color: #fff8eb;
      text-align: left;
      font: inherit;
      cursor: pointer;
      box-shadow: 0 16px 34px rgba(0, 0, 0, 0.32);
      transition: transform 0.18s ease, border-color 0.18s ease, box-shadow 0.18s ease;
    }

    .case-note-button:hover,
    .case-note-button:focus-visible {
      border-color: rgba(255, 232, 184, 0.9);
      box-shadow:
        0 0 0 1px rgba(255, 232, 184, 0.22),
        0 18px 38px rgba(0, 0, 0, 0.38);
      outline: none;
      transform: translateY(-2px);
    }

    .case-note-button__icon {
      position: relative;
      width: 54px;
      height: 54px;
      margin-left: 20px;
      border: 4px solid #2c61b9;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.2);
      box-shadow:
        0 0 0 4px rgba(255, 255, 255, 0.13),
        0 10px 24px rgba(0, 0, 0, 0.24);
    }

    .case-note-button__icon::after {
      content: "";
      position: absolute;
      right: -15px;
      bottom: -10px;
      width: 24px;
      height: 8px;
      border-radius: 999px;
      background: #2c61b9;
      transform: rotate(42deg);
      transform-origin: left center;
    }

    .case-note-button__copy {
      position: relative;
      z-index: 1;
      min-width: 0;
      padding: 18px 8px 18px 0;
    }

    .case-note-button__copy strong {
      display: block;
      margin-bottom: 6px;
      color: #fff;
      font-size: clamp(1.26rem, 2vw, 2rem);
      line-height: 1.12;
      font-weight: 950;
      word-break: keep-all;
    }

    .case-note-button__copy span {
      display: block;
      color: rgba(255, 248, 235, 0.78);
      font-size: 0.96rem;
      line-height: 1.4;
      font-weight: 800;
      word-break: keep-all;
    }

    .case-note-button__mascot {
      align-self: stretch;
      position: relative;
      min-height: 116px;
      background: rgba(255, 244, 222, 0.22);
    }

    .case-note-button__mascot img {
      position: absolute;
      right: -18px;
      bottom: -22px;
      width: 220px;
      height: 148px;
      object-fit: cover;
      object-position: 47% 54%;
      filter: drop-shadow(0 12px 18px rgba(0, 0, 0, 0.3));
    }

    @media (max-width: 640px) {
      .case-note-button {
        grid-template-columns: 64px minmax(0, 1fr) 112px;
        min-height: 98px;
      }

      .case-note-button__icon {
        width: 42px;
        height: 42px;
        margin-left: 14px;
        border-width: 3px;
      }

      .case-note-button__icon::after {
        right: -12px;
        bottom: -8px;
        width: 20px;
        height: 7px;
      }

      .case-note-button__copy {
        padding: 14px 4px 14px 0;
      }

      .case-note-button__copy strong {
        font-size: 1.08rem;
      }

      .case-note-button__copy span {
        font-size: 0.78rem;
      }

      .case-note-button__mascot {
        min-height: 98px;
      }

      .case-note-button__mascot img {
        right: -52px;
        bottom: -18px;
        width: 148px;
        height: 116px;
      }
    }

    .similarity-modal {
      position: fixed;
      inset: 0;
      z-index: 60;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 12px;
      background: rgba(12, 9, 6, 0.72);
    }

    .similarity-modal[hidden] { display: none; }

    .similarity-modal__panel {
      width: min(560px, 100%);
      /* 화면 높이에 비례. 특정 픽셀에 고정하지 않고 뷰포트에서 모달 패딩(12*2)만
         뺀 만큼을 상한으로 둔다. 내용이 더 짧으면 그만큼만 차지하고, 더 길면
         본문만 스크롤되고 발(카운터+전송)은 항상 보인다. dvh는 모바일 주소창을
         감안한 값이고, vh는 미지원 브라우저용 폴백. */
      max-height: calc(100vh - 24px);
      max-height: calc(100dvh - 24px);
      display: flex;
      flex-direction: column;
      gap: 10px;
      border-radius: 14px;
      background: #fffaf0;
      border: 1px solid #e4d3ab;
      box-shadow: 0 22px 60px rgba(0, 0, 0, 0.42);
      padding: 16px;
    }

    .similarity-modal__head {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .similarity-modal__head h2 {
      margin: 0;
      color: #24180f;
      font-size: 1.1rem;
      font-weight: 950;
    }

    .similarity-modal__close {
      background: transparent;
      color: #7a5a3a;
      font-size: 1.1rem;
      font-weight: 900;
      padding: 4px 8px;
    }

    /* 본문(안내+문장 틀)만 스크롤되고 아래 발(카운터+전송)은 항상 보이게 한다. */
    .similarity-modal__form {
      flex: 1 1 auto;
      min-height: 0;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .similarity-modal__form[hidden] { display: none; }

    .similarity-modal__body {
      flex: 1 1 auto;
      min-height: 0;
      overflow-y: auto;
      display: grid;
      gap: 8px;
      align-content: start;
    }

    .similarity-modal__intro {
      margin: 0;
      color: #6b563a;
      font-size: 0.8rem;
      font-weight: 850;
    }

    .similarity-template {
      display: grid;
      gap: 6px;
      border-radius: 10px;
      background: #fff;
      border: 1px solid #ecdcbb;
      padding: 10px;
    }

    .s-line {

      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 5px;
      color: #24180f;
      font-size: 0.9rem;
      font-weight: 850;
      line-height: 1.4;

    .s-blank {

      border-radius: 7px;
      background: #fffdf7;
      color: #24180f;
      padding: 6px 8px;
      font: inherit;
      font-weight: 800;

      box-shadow: 0 0 0 3px rgba(185, 31, 31, 0.12);

    .s-blank--sm { width: 132px; }
    .s-blank--md { width: 210px; max-width: 100%; }

    .similarity-modal__foot {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;

    .similarity-modal__count {

    .similarity-modal__submit {

      font-weight: 850;

    .similarity-modal__status.is-bad { color: #b3221d; }

    .similarity-confirm {
      flex: 1 1 auto;
      min-height: 0;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .similarity-confirm[hidden] { display: none; }

    .similarity-confirm__body {

      gap: 10px;

    .similarity-confirm__actions {
      flex: 0 0 auto;
      display: flex;

        grid-template-areas:

      .student-main > .evidence-vault-card {
        position: static;
      }

      .student-menu {
        position: static;

        max-height: none;

      .suspect-column {

      .chat-card {

      .suspect-card img {

    @media (max-width: 760px) {
      .page {
        padding: 12px;

      .topbar {
        align-items: flex-start;
        flex-direction: column;
      }

      .student-tools {
        grid-template-columns: 1fr;
      }

      .suspect-column,
      .footer-grid {
        grid-template-columns: 1fr;
      }

      .chat-card,

      .note-card {
        grid-column: auto;
        grid-row: auto;
      }

      .chat-card {
        grid-template-rows: auto minmax(300px, 44vh) auto;
      }

      .suspect-card img {
        max-height: none;
      }

      .card-lightbox {
        padding: 12px;
      }

      .card-lightbox__image {
        max-width: calc(100vw - 24px);
        max-height: calc(100vh - 24px);
      }
    }

            <p class="s-line"><span>범인은</span><input class="s-blank s-blank--sm" type="text" data-similarity-blank="culprit" maxlength="15" placeholder="누구인지 쓰세요"><span>이다. 범인은</span><input class="s-blank s-blank--md" type="text" data-similarity-blank="tool" maxlength="30" placeholder="무엇을 사용했는지 쓰세요"><span>를 사용해</span></p>
            <textarea class="s-blank s-blank--area" data-similarity-blank="method" maxlength="120" rows="2" placeholder="어떻게 했는지 쓰세요"></textarea>
            <p class="s-line"><span>해서 시험 예상 문제가 유출되었다. 그 근거는</span></p>
            <textarea class="s-blank s-blank--area" data-similarity-blank="evidence" maxlength="130" rows="2" placeholder="증거를 쉼표로 구분해 쓰세요"></textarea>
            <p class="s-line"><span>이다. 범인에게 가장 부족했던 AI 윤리 역량은</span><input class="s-blank s-blank--sm" type="text" data-similarity-blank="competency" maxlength="15" placeholder="어떤 역량이 부족했는지 쓰세요"><span>이며, 그 이유는</span></p>
            <textarea class="s-blank s-blank--area" data-similarity-blank="reason" maxlength="100" rows="2" placeholder="왜 그렇게 생각했는지 쓰세요"></textarea>
          </div>
        </div>
        <div class="similarity-modal__foot">
          <span class="similarity-modal__count" data-similarity-count>0/500</span>
          <button class="similarity-modal__submit" type="submit" data-similarity-submit>전송</button>
        </div>
      </form>
      <div class="similarity-confirm" data-similarity-confirm hidden>
        <div class="similarity-confirm__body">
          <p class="similarity-confirm__label">이 문장을 선생님께 보낼까요?</p>
          <blockquote class="similarity-confirm__sentence" data-similarity-confirm-sentence></blockquote>
          <p class="similarity-confirm__notice" data-similarity-confirm-notice hidden></p>
        </div>
        <div class="similarity-confirm__actions">
          <button class="similarity-confirm__back" type="button" data-similarity-confirm-cancel>뒤로</button>
          <button class="similarity-confirm__send" type="button" data-similarity-confirm-send>보내기</button>
        </div>
      </div>
      <p class="similarity-modal__status" data-similarity-status role="status"></p>
    </div>
  </div>
</body>
</html>
