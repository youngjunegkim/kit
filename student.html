<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>학생용 AI 심문실</title>
  <script src="auth.js" defer></script>
  <script src="presence.js?v=manual-presence-3" defer></script>
  <script src="student-interrogation.js" defer></script>
  <script src="student-notes.js" defer></script>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at 16% 10%, rgba(47, 110, 234, 0.2), transparent 30%),
        linear-gradient(135deg, #0d1522 0%, #172235 52%, #202436 100%);
      color: #18202b;
      font-family: "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
      letter-spacing: 0;
    }

    .page {
      width: min(1280px, 100%);
      margin: 0 auto;
      padding: 24px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 18px;
      color: #fff;
    }

    h1 {
      margin: 0;
      font-size: 1.7rem;
      line-height: 1.2;
    }

    .topbar p {
      margin: 6px 0 0;
      color: rgba(255, 255, 255, 0.76);
      font-weight: 800;
    }

    .logout-btn {
      min-height: 38px;
      border: 0;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.14);
      color: #fff;
      cursor: pointer;
      padding: 8px 12px;
      font: inherit;
      font-weight: 900;
    }

    .receive-credit-btn {
      min-height: 38px;
      border: 0;
      border-radius: 6px;
      background: #dc342f;
      color: #fff;
      cursor: pointer;
      padding: 8px 12px;
      font: inherit;
      font-weight: 950;
      box-shadow: 0 10px 24px rgba(220, 52, 47, 0.24);
    }

    .evidence-code-form {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 8px;
    }

    .evidence-code-input {
      min-width: 0;
      min-height: 38px;
      border: 1px solid rgba(231, 189, 73, 0.42);
      border-radius: 7px;
      background: rgba(255, 255, 255, 0.96);
      color: #18202b;
      padding: 8px 10px;
      font: inherit;
      font-weight: 850;
      text-transform: uppercase;
    }

    .evidence-code-input:focus {
      border-color: #e1ae2d;
      box-shadow: 0 0 0 3px rgba(225, 174, 45, 0.16);
      outline: none;
    }

    .evidence-code-message {
      min-height: 18px;
      margin: -3px 0 0;
      color: rgba(255, 255, 255, 0.72);
      font-size: 0.78rem;
      line-height: 1.35;
      font-weight: 850;
    }

    .evidence-code-message.is-ok {
      color: #8ee0b2;
    }

    .evidence-code-message.is-bad {
      color: #ffafa9;
    }

    .receive-credit-btn:hover,
    .receive-credit-btn:focus-visible {
      background: #b82924;
      outline: none;
    }

    .presence-refresh-btn {
      min-height: 38px;
      border: 0;
      border-radius: 6px;
      background: #eef1f5;
      color: #18202b;
      cursor: pointer;
      padding: 8px 12px;
      font: inherit;
      font-weight: 950;
      white-space: nowrap;
    }

    .presence-refresh-btn:hover,
    .presence-refresh-btn:focus-visible {
      background: #dfe5ec;
      outline: none;
    }

    .presence-refresh-btn:disabled {
      cursor: wait;
      opacity: 0.62;
    }

    .student-tools {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .credit-pill {
      min-height: 38px;
      display: flex;
      align-items: center;
      gap: 8px;
      border: 1px solid rgba(255, 255, 255, 0.26);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.12);
      color: #fff;
      padding: 8px 11px;
      font-weight: 950;
    }

    .credit-pill span {
      color: rgba(255, 255, 255, 0.72);
      font-size: 0.84rem;
    }

    .student-log-card {
      margin-top: 18px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.96);
      border: 1px solid rgba(255, 255, 255, 0.62);
      box-shadow: 0 18px 50px rgba(0, 0, 0, 0.26);
      padding: 16px;
    }

    .student-log-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
    }

    .student-log-head h2 {
      margin: 0;
      color: #18202b;
      font-size: 1.08rem;
      line-height: 1.2;
    }

    .student-log-head strong {
      color: #c92521;
      font-size: 0.95rem;
      font-weight: 950;
    }

    .student-log-actions {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
      flex-wrap: wrap;
    }

    .student-log-list {
      display: grid;
      gap: 8px;
      max-height: 230px;
      overflow-y: auto;
    }

    .student-log-entry {
      border: 1px solid #e1e8f0;
      border-radius: 8px;
      background: #fbfdff;
      padding: 10px;
    }

    .student-log-entry span {
      display: block;
      color: #657181;
      font-size: 0.78rem;
      font-weight: 900;
    }

    .student-log-entry p,
    .student-log-empty {
      margin: 5px 0 0;
      color: #18202b;
      font-size: 0.9rem;
      line-height: 1.42;
      font-weight: 800;
    }

    .student-log-empty {
      margin: 0;
      color: #657181;
    }

    .presence-list {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 8px;
    }

    .presence-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      min-height: 40px;
      border: 1px solid #e1e8f0;
      border-radius: 8px;
      background: #fbfdff;
      padding: 8px 10px;
      font-weight: 950;
    }

    .presence-name {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .presence-role {
      flex: 0 0 auto;
      border-radius: 999px;
      background: #e9eef5;
      color: #516071;
      padding: 3px 7px;
      font-size: 0.74rem;
      font-weight: 950;
    }

    .presence-empty {
      grid-column: 1 / -1;
      margin: 0;
      color: #657181;
      font-weight: 850;
    }

    .suspect-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 18px;
      align-items: start;
    }

    .suspect-column {
      display: grid;
      gap: 12px;
      min-width: 0;
    }

    .suspect-card,
    .note-card {
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.96);
      border: 1px solid rgba(255, 255, 255, 0.62);
      box-shadow: 0 18px 50px rgba(0, 0, 0, 0.32);
      overflow: hidden;
    }

    .suspect-card {
      display: grid;
      grid-template-rows: auto 1fr;
      color: inherit;
      text-decoration: none;
    }

    .suspect-card:hover,
    .suspect-card:focus-visible {
      outline: 3px solid rgba(243, 52, 47, 0.48);
      outline-offset: 3px;
    }

    .suspect-card img {
      width: 100%;
      aspect-ratio: 1 / 1;
      object-fit: contain;
      object-position: center;
      background: #dfe6ef;
      padding: 18px;
    }

    .suspect-info {
      padding: 18px;
    }

    .suspect-info h2,
    .note-card h3 {
      margin: 0 0 8px;
      line-height: 1.2;
    }

    .suspect-info h2 {
      font-size: 1.34rem;
    }

    .suspect-info p {
      margin: 0;
      color: #657181;
      font-weight: 800;
      line-height: 1.45;
    }

    .note-card {
      padding: 14px;
    }

    .note-card h3 {
      color: #18202b;
      font-size: 1.08rem;
    }

    .note-area {
      width: 100%;
      min-height: 260px;
      border: 1px solid #cfd8e4;
      border-radius: 8px;
      background:
        linear-gradient(#fff 31px, #e8eef6 32px),
        #fff;
      background-size: 100% 32px;
      color: #18202b;
      padding: 10px 12px;
      resize: vertical;
      font: inherit;
      font-weight: 750;
      line-height: 32px;
    }

    .note-area:focus {
      border-color: #f3342f;
      box-shadow: 0 0 0 3px rgba(243, 52, 47, 0.14);
      outline: none;
    }

    .note-tools {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-top: 10px;
      color: #657181;
      font-size: 0.88rem;
      font-weight: 900;
    }

    .clear-note {
      min-height: 32px;
      border: 0;
      border-radius: 6px;
      background: #e9eef5;
      color: #344154;
      cursor: pointer;
      padding: 6px 10px;
      font: inherit;
      font-weight: 900;
    }

    .clear-note:hover,
    .clear-note:focus-visible {
      background: #dfe6ef;
      outline: none;
    }

    .science-mission-card {
      display: grid;
      grid-template-columns: minmax(260px, 1.25fr) minmax(240px, 0.75fr);
      gap: 0;
      margin-top: 18px;
      border-radius: 8px;
      overflow: hidden;
      background: rgba(255, 255, 255, 0.96);
      border: 1px solid rgba(255, 255, 255, 0.62);
      box-shadow: 0 18px 50px rgba(0, 0, 0, 0.26);
      color: inherit;
      text-decoration: none;
    }

    .science-mission-card:hover,
    .science-mission-card:focus-visible {
      outline: 3px solid rgba(243, 52, 47, 0.48);
      outline-offset: 3px;
    }

    .science-mission-card img {
      width: 100%;
      height: 100%;
      min-height: 230px;
      object-fit: cover;
      object-position: center;
      background: #dfe6ef;
    }

    .science-mission-info {
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 24px;
    }

    .science-mission-info h2 {
      margin: 0 0 10px;
      color: #18202b;
      font-size: 1.5rem;
      line-height: 1.2;
    }

    .science-mission-info p {
      margin: 0;
      color: #657181;
      font-weight: 850;
      line-height: 1.45;
    }

    @media (max-width: 980px) {
      .suspect-grid {
        grid-template-columns: 1fr;
      }

      .presence-list {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .suspect-card {
        grid-template-columns: 180px minmax(0, 1fr);
      }

      .suspect-card img {
        height: 100%;
        aspect-ratio: auto;
      }

      .science-mission-card {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 640px) {
      .page {
        padding: 14px;
      }

      .topbar {
        align-items: start;
        flex-direction: column;
      }

      .suspect-card {
        grid-template-columns: 1fr;
      }

      .note-area {
        min-height: 220px;
      }

      .presence-list {
        grid-template-columns: 1fr;
      }
    }

    body {
      background:
        radial-gradient(circle at 18% 12%, rgba(157, 47, 38, 0.24), transparent 28%),
        linear-gradient(135deg, #120f0c 0%, #24180f 45%, #18202b 100%);
    }

    button,
    input,
    textarea {
      font: inherit;
    }

    button {
      border: 0;
      cursor: pointer;
    }

    .page {
      width: min(1760px, 100%);
      padding: 18px;
    }

    .topbar {
      margin-bottom: 14px;
    }

    .topbar h1 {
      font-size: 1.45rem;
      font-weight: 950;
    }

    .student-workspace {
      display: grid;
      grid-template-columns: 220px minmax(0, 1fr);
      gap: 16px;
      align-items: start;
    }

    .student-menu {
      position: sticky;
      top: 18px;
      display: grid;
      gap: 12px;
      padding: 14px;
      border: 1px solid rgba(225, 174, 45, 0.58);
      border-radius: 8px;
      background: rgba(19, 12, 7, 0.86);
      box-shadow: 0 16px 42px rgba(0, 0, 0, 0.32);
      color: #fff;
    }

    .student-menu-title {
      color: #e1ae2d;
      font-size: 0.82rem;
      font-weight: 950;
      letter-spacing: 0;
    }

    .student-main {
      min-width: 0;
    }

    .credit-pill {
      min-height: 36px;
      border-color: rgba(231, 189, 73, 0.42);
      background: rgba(255, 255, 255, 0.1);
      padding: 7px 10px;
    }

    .student-tools {
      display: grid;
      gap: 9px;
      align-items: stretch;
    }

    .student-tools .credit-pill {
      justify-content: space-between;
      width: 100%;
    }

    .student-tools button {
      width: 100%;
      justify-content: center;
    }

    .credit-pill strong {
      font-size: 0.92rem;
    }

    .status-ok {
      color: #8ee0b2;
    }

    .status-bad {
      color: #ffafa9;
    }

    .receive-credit-btn {
      background: #b91f1f;
      box-shadow: 0 10px 24px rgba(185, 31, 31, 0.24);
    }

    .receive-credit-btn:hover,
    .receive-credit-btn:focus-visible {
      background: #8f1717;
      outline: none;
    }

    .presence-refresh-btn,
    .logout-btn,
    .clear-note {
      background: #efe7d0;
      color: #2c2114;
    }

    .presence-refresh-btn:hover,
    .presence-refresh-btn:focus-visible,
    .logout-btn:hover,
    .logout-btn:focus-visible,
    .clear-note:hover,
    .clear-note:focus-visible {
      background: #e1d2a9;
      outline: none;
    }

    button:disabled,
    input:disabled {
      cursor: not-allowed;
      opacity: 0.62;
    }

    .suspect-grid {
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 16px;
    }

    .suspect-column {
      display: grid;
      gap: 10px;
    }

    .suspect-card {
      position: relative;
      display: grid;
      place-items: center;
      margin: 0;
      width: 100%;
      min-height: 430px;
      height: auto;
      aspect-ratio: 1 / 1.22;
      border-radius: 8px;
      overflow: hidden;
      background: #000;
      border: 1px solid rgba(225, 174, 45, 0.58);
      box-shadow: 0 16px 44px rgba(0, 0, 0, 0.34);
      cursor: zoom-in;
    }

    .suspect-card img {
      position: absolute;
      inset: 0;
      display: block;
      width: 100%;
      max-width: 100%;
      height: 100%;
      max-height: 100%;
      aspect-ratio: auto;
      object-fit: cover;
      object-position: top center;
      background: #000;
      padding: 0;
    }

    .lightbox-open {
      overflow: hidden;
    }

    .card-lightbox {
      position: fixed;
      inset: 0;
      z-index: 1000;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #000;
    }

    .card-lightbox[hidden] {
      display: none;
    }

    .card-lightbox__image {
      display: block;
      width: auto;
      height: auto;
      max-width: min(calc(100vw - 48px), 720px);
      max-height: calc(100vh - 48px);
      object-fit: contain;
      border-radius: 8px;
      box-shadow: 0 24px 70px rgba(0, 0, 0, 0.62);
    }

    .card-lightbox__close {
      position: fixed;
      top: 16px;
      right: 16px;
      width: 44px;
      height: 44px;
      border: 1px solid rgba(255, 255, 255, 0.34);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.12);
      color: #fff;
      cursor: pointer;
      font: inherit;
      font-size: 1.25rem;
      font-weight: 950;
      line-height: 1;
    }

    .card-lightbox__close:hover,
    .card-lightbox__close:focus-visible {
      background: rgba(255, 255, 255, 0.22);
      outline: 3px solid rgba(255, 255, 255, 0.36);
      outline-offset: 2px;
    }

    .chat-card,
    .note-card,
    .student-log-card {
      border: 1px solid rgba(255, 255, 255, 0.62);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.96);
      box-shadow: 0 14px 34px rgba(0, 0, 0, 0.22);
      overflow: hidden;
    }

    .chat-card {
      display: grid;
      grid-template-rows: auto minmax(150px, 24vh) auto;
    }

    .chat-head,
    .student-log-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 12px;
      border-bottom: 1px solid #e2d6b7;
    }

    .chat-head h2,
    .student-log-head h2,
    .note-card h3 {
      margin: 0;
      color: #2a1e13;
      font-size: 1rem;
      line-height: 1.2;
      font-weight: 950;
    }

    .chat-state {
      color: #8f1717;
      font-size: 0.78rem;
      font-weight: 950;
      white-space: nowrap;
    }

    .messages {
      min-height: 0;
      display: grid;
      align-content: start;
      gap: 9px;
      overflow-y: auto;
      padding: 12px;
      background: #f6f0df;
    }

    .message {
      max-width: 92%;
      display: grid;
      gap: 3px;
    }

    .message--user {
      justify-self: end;
    }

    .message__name {
      color: #786850;
      font-size: 0.72rem;
      font-weight: 950;
    }

    .message--user .message__name {
      text-align: right;
    }

    .message__bubble {
      border-radius: 8px;
      background: #fff;
      color: #201810;
      padding: 9px 10px;
      font-size: 0.88rem;
      line-height: 1.45;
      font-weight: 750;
      word-break: keep-all;
      box-shadow: 0 1px 0 rgba(0, 0, 0, 0.05);
    }

    .message--user .message__bubble {
      background: #8f1717;
      color: #fff;
    }

    .chat-form {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 8px;
      padding: 10px;
      border-top: 1px solid #e2d6b7;
      background: #fffaf0;
    }

    .chat-input {
      min-width: 0;
      min-height: 40px;
      border: 1px solid #d6c49b;
      border-radius: 7px;
      background: #fff;
      color: #18202b;
      padding: 8px 10px;
      font-weight: 800;
    }

    .chat-input:focus,
    .note-area:focus {
      border-color: #a31616;
      box-shadow: 0 0 0 3px rgba(163, 22, 22, 0.14);
      outline: none;
    }

    .send-btn {
      min-width: 58px;
      min-height: 40px;
      border-radius: 7px;
      background: #2a1e13;
      color: #fff;
      padding: 8px 12px;
      font-weight: 950;
    }

    .send-btn:hover,
    .send-btn:focus-visible {
      background: #8f1717;
      outline: none;
    }

    .note-card {
      padding: 12px;
    }

    .note-area {
      min-height: 132px;
      margin-top: 9px;
      border-color: #d6c49b;
    }

    .footer-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 14px;
      margin-top: 16px;
    }

    .student-log-head .presence-refresh-btn {
      min-width: 170px;
    }

    .student-log-card {
      padding: 0;
    }

    .footer-grid .student-log-card {
      margin-top: 0;
    }

    .student-log-list,
    .presence-list {
      display: grid;
      gap: 8px;
      max-height: 230px;
      overflow-y: auto;
      padding: 12px;
      background: #fffaf0;
    }

    .student-log-entry,
    .presence-row {
      border-color: #e4d8bd;
      background: #fff;
    }

    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    @media (max-width: 1180px) {
      .student-workspace {
        grid-template-columns: 1fr;
      }

      .student-menu {
        position: static;
      }

      .student-tools {
        grid-template-columns: repeat(4, minmax(0, 1fr));
      }

      .student-tools button {
        min-width: 0;
      }

      .suspect-grid {
        grid-template-columns: 1fr;
      }

      .suspect-column {
        grid-template-columns: minmax(220px, 0.7fr) minmax(0, 1fr);
        align-items: start;
      }

      .suspect-card,
      .note-card {
        grid-column: 1;
      }

      .chat-card {
        grid-column: 2;
        grid-row: 1 / span 2;
        grid-template-rows: auto minmax(360px, 48vh) auto;
      }

      .suspect-card img {
        max-height: 100%;
      }
    }

    @media (max-width: 760px) {
      .page {
        padding: 12px;
      }

      .topbar {
        align-items: flex-start;
        flex-direction: column;
      }

      .student-tools {
        grid-template-columns: 1fr;
      }

      .suspect-column,
      .footer-grid {
        grid-template-columns: 1fr;
      }

      .chat-card,
      .suspect-card,
      .note-card {
        grid-column: auto;
        grid-row: auto;
      }

      .chat-card {
        grid-template-rows: auto minmax(300px, 44vh) auto;
      }

      .suspect-card img {
        max-height: none;
      }

      .card-lightbox {
        padding: 12px;
      }

      .card-lightbox__image {
        max-width: calc(100vw - 24px);
        max-height: calc(100vh - 24px);
      }
    }
  </style>
</head>
<body data-auth="student">
  <main class="page">
    <header class="topbar">
      <h1>AI 페르소나 심문실</h1>
    </header>

    <div class="student-workspace">
      <aside class="student-menu" aria-label="질문권 메뉴">
        <strong class="student-menu-title">MENU</strong>
        <div class="student-tools">
          <div class="credit-pill" aria-label="남은 질문권">
            <span data-team-label>학생</span>
            <strong data-credit-count>확인 중</strong>
          </div>
          <div class="credit-pill" aria-label="사용한 질문권">
            <span>사용</span>
            <strong data-log-count>0회</strong>
          </div>
          <div class="credit-pill" aria-label="AI 연결 상태">
            <span>AI</span>
            <strong data-api-status>확인 중</strong>
          </div>
          <div class="credit-pill" aria-label="접속 중 계정">
            <span>접속</span>
            <strong data-presence-count>0명</strong>
          </div>
          <form class="evidence-code-form" data-evidence-form>
            <label class="visually-hidden" for="studentEvidenceCode">증거 코드 입력</label>
            <input class="evidence-code-input" id="studentEvidenceCode" data-evidence-code type="text" autocomplete="off" maxlength="12" placeholder="증거 코드">
            <button class="receive-credit-btn" type="submit" data-evidence-submit>입력</button>
          </form>
          <p class="evidence-code-message" data-evidence-message></p>
          <button class="presence-refresh-btn" type="button" data-refresh-presence>접속 중 인원 보기</button>
          <button class="receive-credit-btn" type="button" data-refresh-credits>질문권 받기</button>
          <button class="logout-btn" type="button" data-logout>로그아웃</button>
        </div>
      </aside>

      <div class="student-main">
        <section class="suspect-grid" aria-label="용의자 심문">
          <article class="suspect-column" data-suspect-panel data-suspect="kangWoojin" data-suspect-name="강우진">
            <figure class="suspect-card">
              <img src="assets/suspect-card-kang.png" alt="강우진 용의자 카드">
            </figure>

        <section class="chat-card" aria-label="강우진 심문">
          <div class="chat-head">
            <h2>강우진</h2>
            <span class="chat-state" data-chat-state>대기</span>
          </div>
          <div class="messages" data-chat-messages aria-live="polite"></div>
          <form class="chat-form" data-chat-form>
            <label class="visually-hidden" for="chatKangWoojin">강우진 질문 입력</label>
            <input class="chat-input" id="chatKangWoojin" type="text" autocomplete="off" data-chat-input placeholder="강우진에게 질문하기">
            <button class="send-btn" type="submit" data-chat-submit>전송</button>
          </form>
        </section>

        <section class="note-card" aria-label="강우진 심문 노트">
          <h3>강우진 심문 노트</h3>
          <textarea class="note-area" data-note-key="kang-woojin" placeholder="1.&#10;2.&#10;3.&#10;4.&#10;5."></textarea>
          <div class="note-tools">
            <span data-note-status="kang-woojin">자동 저장</span>
            <button class="clear-note" type="button" data-clear-note="kang-woojin">비우기</button>
          </div>
        </section>
      </article>

      <article class="suspect-column" data-suspect-panel data-suspect="seoHarin" data-suspect-name="서하린">
        <figure class="suspect-card">
          <img src="assets/suspect-card-harin.png" alt="서하린 용의자 카드">
        </figure>

        <section class="chat-card" aria-label="서하린 심문">
          <div class="chat-head">
            <h2>서하린</h2>
            <span class="chat-state" data-chat-state>대기</span>
          </div>
          <div class="messages" data-chat-messages aria-live="polite"></div>
          <form class="chat-form" data-chat-form>
            <label class="visually-hidden" for="chatSeoHarin">서하린 질문 입력</label>
            <input class="chat-input" id="chatSeoHarin" type="text" autocomplete="off" data-chat-input placeholder="서하린에게 질문하기">
            <button class="send-btn" type="submit" data-chat-submit>전송</button>
          </form>
        </section>

        <section class="note-card" aria-label="서하린 심문 노트">
          <h3>서하린 심문 노트</h3>
          <textarea class="note-area" data-note-key="seo-harin" placeholder="1.&#10;2.&#10;3.&#10;4.&#10;5."></textarea>
          <div class="note-tools">
            <span data-note-status="seo-harin">자동 저장</span>
            <button class="clear-note" type="button" data-clear-note="seo-harin">비우기</button>
          </div>
        </section>
      </article>

      <article class="suspect-column" data-suspect-panel data-suspect="choiDaniel" data-suspect-name="최다니엘">
        <figure class="suspect-card">
          <img src="assets/suspect-card-daniel.png" alt="최다니엘 용의자 카드">
        </figure>

        <section class="chat-card" aria-label="최다니엘 심문">
          <div class="chat-head">
            <h2>최다니엘</h2>
            <span class="chat-state" data-chat-state>대기</span>
          </div>
          <div class="messages" data-chat-messages aria-live="polite"></div>
          <form class="chat-form" data-chat-form>
            <label class="visually-hidden" for="chatChoiDaniel">최다니엘 질문 입력</label>
            <input class="chat-input" id="chatChoiDaniel" type="text" autocomplete="off" data-chat-input placeholder="최다니엘에게 질문하기">
            <button class="send-btn" type="submit" data-chat-submit>전송</button>
          </form>
        </section>

        <section class="note-card" aria-label="최다니엘 심문 노트">
          <h3>최다니엘 심문 노트</h3>
          <textarea class="note-area" data-note-key="choi-daniel" placeholder="1.&#10;2.&#10;3.&#10;4.&#10;5."></textarea>
          <div class="note-tools">
            <span data-note-status="choi-daniel">자동 저장</span>
            <button class="clear-note" type="button" data-clear-note="choi-daniel">비우기</button>
          </div>
        </section>
      </article>
    </section>

    <div class="footer-grid">
      <section class="student-log-card" aria-label="접속 중 계정">
        <div class="student-log-head">
          <h2>접속 중 계정</h2>
          <button class="presence-refresh-btn" type="button" data-refresh-presence>접속 중 인원 보기</button>
        </div>
        <div class="presence-list" data-presence-list></div>
      </section>
    </div>
      </div>
    </div>
  </main>
  <div class="card-lightbox" data-card-lightbox hidden role="dialog" aria-modal="true" aria-label="Suspect card">
    <button class="card-lightbox__close" type="button" data-close-card aria-label="Close">X</button>
    <img class="card-lightbox__image" data-card-lightbox-image alt="">
  </div>
</body>
</html>
