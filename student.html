<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>학생용 AI 심문실</title>
  <script src="auth.js" defer></script>
  <script src="presence.js?v=manual-presence-3" defer></script>
  <script src="ethics-quiz.js" defer></script>
  <script src="token-estimator.js" defer></script>
  <script src="student-interrogation.js" defer></script>
  <script src="student-notes.js" defer></script>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at 16% 10%, rgba(47, 110, 234, 0.2), transparent 30%),
        linear-gradient(135deg, #0d1522 0%, #172235 52%, #202436 100%);
      color: #18202b;
      font-family: "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
      letter-spacing: 0;
    }

    .page {
      width: min(1280px, 100%);
      margin: 0 auto;
      padding: 24px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 18px;
      color: #fff;
    }

    h1 {
      margin: 0;
      font-size: 1.7rem;
      line-height: 1.2;
    }

    .topbar p {
      margin: 6px 0 0;
      color: rgba(255, 255, 255, 0.76);
      font-weight: 800;
    }

    .logout-btn {
      min-height: 38px;
      border: 0;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.14);
      color: #fff;
      cursor: pointer;
      padding: 8px 12px;
      font: inherit;
      font-weight: 900;
    }

    .receive-credit-btn {
      min-height: 38px;
      border: 0;
      border-radius: 6px;
      background: #dc342f;
      color: #fff;
      cursor: pointer;
      padding: 8px 12px;
      font: inherit;
      font-weight: 950;
      box-shadow: 0 10px 24px rgba(220, 52, 47, 0.24);
    }

    .evidence-code-form {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 8px;
    }

    .evidence-code-input {
      min-width: 0;
      min-height: 38px;
      border: 1px solid rgba(231, 189, 73, 0.42);
      border-radius: 7px;
      background: rgba(255, 255, 255, 0.96);
      color: #18202b;
      padding: 8px 10px;
      font: inherit;
      font-weight: 850;
      text-transform: uppercase;
    }

    .evidence-code-input:focus {
      border-color: #e1ae2d;
      box-shadow: 0 0 0 3px rgba(225, 174, 45, 0.16);
      outline: none;
    }

    .evidence-code-message {
      min-height: 18px;
      margin: -3px 0 0;
      color: rgba(255, 255, 255, 0.72);
      font-size: 0.78rem;
      line-height: 1.35;
      font-weight: 850;
    }

    .evidence-code-message.is-ok {
      color: #8ee0b2;
    }

    .evidence-code-message.is-bad {
      color: #ffafa9;
    }

    .receive-credit-btn:hover,
    .receive-credit-btn:focus-visible {
      background: #b82924;
      outline: none;
    }

    .presence-refresh-btn {
      min-height: 38px;
      border: 0;
      border-radius: 6px;
      background: #eef1f5;
      color: #18202b;
      cursor: pointer;
      padding: 8px 12px;
      font: inherit;
      font-weight: 950;
      white-space: nowrap;
    }

    .presence-refresh-btn:hover,
    .presence-refresh-btn:focus-visible {
      background: #dfe5ec;
      outline: none;
    }

    .presence-refresh-btn:disabled {
      cursor: wait;
      opacity: 0.62;
    }

    .student-tools {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .credit-pill {
      min-height: 38px;
      display: flex;
      align-items: center;
      gap: 8px;
      border: 1px solid rgba(255, 255, 255, 0.26);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.12);
      color: #fff;
      padding: 8px 11px;
      font-weight: 950;
    }

    .credit-pill span {
      color: rgba(255, 255, 255, 0.72);
      font-size: 0.84rem;
    }

    .student-log-card {
      margin-top: 18px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.96);
      border: 1px solid rgba(255, 255, 255, 0.62);
      box-shadow: 0 18px 50px rgba(0, 0, 0, 0.26);
      padding: 16px;
    }

    .student-log-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
    }

    .student-log-head h2 {
      margin: 0;
      color: #18202b;
      font-size: 1.08rem;
      line-height: 1.2;
    }

    .student-log-head strong {
      color: #c92521;
      font-size: 0.95rem;
      font-weight: 950;
    }

    .student-log-actions {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
      flex-wrap: wrap;
    }

    .student-log-list {
      display: grid;
      gap: 8px;
      max-height: 230px;
      overflow-y: auto;
    }

    .student-log-entry {
      border: 1px solid #e1e8f0;
      border-radius: 8px;
      background: #fbfdff;
      padding: 10px;
    }

    .student-log-entry span {
      display: block;
      color: #657181;
      font-size: 0.78rem;
      font-weight: 900;
    }

    .student-log-entry p,
    .student-log-empty {
      margin: 5px 0 0;
      color: #18202b;
      font-size: 0.9rem;
      line-height: 1.42;
      font-weight: 800;
    }

    .student-log-empty {
      margin: 0;
      color: #657181;
    }

    .presence-list {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 8px;
    }

    .presence-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      min-height: 40px;
      border: 1px solid #e1e8f0;
      border-radius: 8px;
      background: #fbfdff;
      padding: 8px 10px;
      font-weight: 950;
    }

    .presence-name {
      min-width: 0;
      color: #18202b;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .presence-role {
      flex: 0 0 auto;
      border-radius: 999px;
      background: #e9eef5;
      color: #516071;
      padding: 3px 7px;
      font-size: 0.74rem;
      font-weight: 950;
    }

    .presence-empty {
      grid-column: 1 / -1;
      margin: 0;
      color: #657181;
      font-weight: 850;
    }

    .suspect-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 18px;
      align-items: start;
    }

    .suspect-column {
      display: grid;
      gap: 12px;
      min-width: 0;
    }

    .suspect-card,
    .note-card {
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.96);
      border: 1px solid rgba(255, 255, 255, 0.62);
      box-shadow: 0 18px 50px rgba(0, 0, 0, 0.32);
      overflow: hidden;
    }

    .suspect-card {
      display: grid;
      grid-template-rows: auto 1fr;
      color: inherit;
      text-decoration: none;
    }

    .suspect-card:hover,
    .suspect-card:focus-visible {
      outline: 3px solid rgba(243, 52, 47, 0.48);
      outline-offset: 3px;
    }

    .suspect-card img {
      width: 100%;
      aspect-ratio: 1 / 1;
      object-fit: contain;
      object-position: center;
      background: #dfe6ef;
      padding: 18px;
    }

    .suspect-info {
      padding: 18px;
    }

    .suspect-info h2,
    .note-card h3 {
      margin: 0 0 8px;
      line-height: 1.2;
    }

    .suspect-info h2 {
      font-size: 1.34rem;
    }

    .suspect-info p {
      margin: 0;
      color: #657181;
      font-weight: 800;
      line-height: 1.45;
    }

    .note-card {
      padding: 14px;
    }

    .note-card h3 {
      color: #18202b;
      font-size: 1.08rem;
    }

    .note-area {
      width: 100%;
      min-height: 260px;
      border: 1px solid #cfd8e4;
      border-radius: 8px;
      background:
        linear-gradient(#fff 31px, #e8eef6 32px),
        #fff;
      background-size: 100% 32px;
      color: #18202b;
      padding: 10px 12px;
      resize: vertical;
      font: inherit;
      font-weight: 750;
      line-height: 32px;
    }

    .note-area:focus {
      border-color: #f3342f;
      box-shadow: 0 0 0 3px rgba(243, 52, 47, 0.14);
      outline: none;
    }

    .note-tools {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-top: 10px;
      color: #657181;
      font-size: 0.88rem;
      font-weight: 900;
    }

    .clear-note {
      min-height: 32px;
      border: 0;
      border-radius: 6px;
      background: #e9eef5;
      color: #344154;
      cursor: pointer;
      padding: 6px 10px;
      font: inherit;
      font-weight: 900;
    }

    .clear-note:hover,
    .clear-note:focus-visible {
      background: #dfe6ef;
      outline: none;
    }

    .science-mission-card {
      display: grid;
      grid-template-columns: minmax(260px, 1.25fr) minmax(240px, 0.75fr);
      gap: 0;
      margin-top: 18px;
      border-radius: 8px;
      overflow: hidden;
      background: rgba(255, 255, 255, 0.96);
      border: 1px solid rgba(255, 255, 255, 0.62);
      box-shadow: 0 18px 50px rgba(0, 0, 0, 0.26);
      color: inherit;
      text-decoration: none;
    }

    .science-mission-card:hover,
    .science-mission-card:focus-visible {
      outline: 3px solid rgba(243, 52, 47, 0.48);
      outline-offset: 3px;
    }

    .science-mission-card img {
      width: 100%;
      height: 100%;
      min-height: 230px;
      object-fit: cover;
      object-position: center;
      background: #dfe6ef;
    }

    .science-mission-info {
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 24px;
    }

    .science-mission-info h2 {
      margin: 0 0 10px;
      color: #18202b;
      font-size: 1.5rem;
      line-height: 1.2;
    }

    .science-mission-info p {
      margin: 0;
      color: #657181;
      font-weight: 850;
      line-height: 1.45;
    }

    .student-ethics-card {
      display: grid;
      gap: 14px;
      border-radius: 8px;
      background: rgba(255, 250, 240, 0.98);
      border: 1px solid rgba(225, 174, 45, 0.58);
      box-shadow: 0 18px 50px rgba(0, 0, 0, 0.26);
      padding: 16px;
    }

    .student-ethics-card[hidden] {
      display: none;
    }

    .student-ethics-head {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: start;
      border-bottom: 1px solid #e2d6b7;
      padding-bottom: 12px;
    }

    .student-ethics-kicker {
      margin: 0 0 5px;
      color: #a2201c;
      font-size: 0.82rem;
      font-weight: 950;
    }

    .student-ethics-head h2 {
      margin: 0;
      color: #22170e;
      font-size: 1.28rem;
      line-height: 1.25;
      font-weight: 950;
    }

    .student-ethics-meta {
      flex: 0 0 auto;
      border-radius: 999px;
      background: #f0e5d0;
      color: #4a3724;
      padding: 6px 10px;
      font-size: 0.82rem;
      font-weight: 950;
    }

    .student-ethics-source {
      display: grid;
      justify-items: center;
      gap: 8px;
      border: 1px solid #e2d6b7;
      border-radius: 8px;
      background: #fff;
      padding: 12px;
    }

    .student-ethics-question-layout {
      display: grid;
      grid-template-columns: minmax(280px, 0.9fr) minmax(360px, 1.1fr);
      gap: 16px;
      align-items: start;
    }

    .student-ethics-question-layout .student-ethics-source {
      position: sticky;
      top: 14px;
      align-self: start;
    }

    .student-ethics-source img {
      display: block;
      width: 100%;
      max-width: 100%;
      height: auto;
      max-height: none;
      object-fit: contain;
      object-position: center;
      border: 1px solid #e3ddcf;
      border-radius: 6px;
      background: #f8f4ec;
    }

    .student-ethics-source span {
      color: #655748;
      font-size: 0.78rem;
      font-weight: 850;
    }

    .student-ethics-source-empty {
      width: 100%;
      border: 1px dashed #d9ccb6;
      border-radius: 7px;
      background: #fbf6eb;
      padding: 18px;
      text-align: center;
    }

    .student-ethics-copy {
      display: grid;
      gap: 12px;
    }

    .student-ethics-section {
      display: grid;
      gap: 8px;
    }

    .student-ethics-section h3 {
      margin: 0;
      color: #7f1715;
      font-size: 0.9rem;
      font-weight: 950;
    }

    .student-ethics-section p {
      margin: 0;
      color: #2a2118;
      line-height: 1.58;
      font-weight: 780;
    }

    .student-ethics-prompt {
      border-left: 4px solid #d82923;
      border-radius: 6px;
      background: #fff;
      padding: 12px 13px;
    }

    .student-ethics-options {
      display: grid;
      gap: 8px;
    }

    .student-ethics-option {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr);
      gap: 10px;
      align-items: start;
      border: 1px solid #e2d6b7;
      border-radius: 8px;
      background: #fff;
      padding: 11px 12px;
      color: #24180f;
      cursor: pointer;
      font-weight: 800;
    }

    .student-ethics-option input {
      margin-top: 3px;
      accent-color: #d82923;
    }

    .student-ethics-option.is-selected {
      border-color: #d82923;
      box-shadow: inset 4px 0 0 #d82923;
    }

    .student-ethics-option.is-correct {
      border-color: #148a5b;
      box-shadow: inset 4px 0 0 #148a5b;
    }

    .student-ethics-option.is-wrong {
      border-color: #d82923;
      background: #fff6f5;
      box-shadow: inset 4px 0 0 #d82923;
    }

    .student-ethics-option.is-locked {
      cursor: not-allowed;
      opacity: 0.88;
    }

    .student-ethics-actions {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
    }

    .student-ethics-next {
      min-height: 40px;
      border-radius: 7px;
      background: #24180f;
      color: #fffaf0;
      padding: 9px 13px;
      font-weight: 950;
    }

    .student-ethics-next:hover,
    .student-ethics-next:focus-visible {
      background: #3a281a;
      outline: none;
    }

    .student-ethics-submit {
      min-height: 40px;
      border-radius: 7px;
      background: #d82923;
      color: #fff;
      padding: 9px 13px;
      font-weight: 950;
    }

    .student-ethics-submit:hover,
    .student-ethics-submit:focus-visible {
      background: #b3221d;
      outline: none;
    }

    .student-ethics-submit:disabled {
      cursor: not-allowed;
      background: #e1d2a9;
      color: #655748;
      opacity: 0.8;
    }

    .student-ethics-status {
      min-height: 24px;
      color: #655748;
      font-weight: 950;
    }

    .student-ethics-status.is-ok {
      color: #116c46;
    }

    .student-ethics-status.is-bad {
      color: #b3221d;
    }

    .student-ethics-explanation {
      display: none;
      gap: 8px;
      border: 1px solid #d7e3d8;
      border-radius: 8px;
      background: #f6fbf5;
      padding: 12px 13px;
    }

    .student-ethics-explanation.is-visible {
      display: grid;
    }

    @media (max-width: 980px) {
      .student-ethics-question-layout {
        grid-template-columns: 1fr;
      }

      .student-ethics-question-layout .student-ethics-source {
        position: static;
      }
    }

    @media (max-width: 980px) {
      .suspect-grid {
        grid-template-columns: 1fr;
      }

      .presence-list {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .suspect-card {
        grid-template-columns: 180px minmax(0, 1fr);
      }

      .suspect-card img {
        height: 100%;
        aspect-ratio: auto;
      }

      .science-mission-card {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 640px) {
      .page {
        padding: 14px;
      }

      .topbar {
        align-items: start;
        flex-direction: column;
      }

      .suspect-card {
        grid-template-columns: 1fr;
      }

      .note-area {
        min-height: 220px;
      }

      .presence-list {
        grid-template-columns: 1fr;
      }
    }

    body {
      background:
        radial-gradient(circle at 18% 12%, rgba(157, 47, 38, 0.24), transparent 28%),
        linear-gradient(135deg, #120f0c 0%, #24180f 45%, #18202b 100%);
    }

    button,
    input,
    textarea {
      font: inherit;
    }

    button {
      border: 0;
      cursor: pointer;
    }

    .page {
      width: min(1760px, 100%);
      padding: 18px;
    }

    .topbar {
      margin-bottom: 14px;
    }

    .topbar h1 {
      font-size: 1.45rem;
      font-weight: 950;
    }

    .student-workspace {
      display: grid;
      grid-template-columns: 220px minmax(0, 1fr);
      gap: 16px;
      align-items: start;
    }

    .student-menu {
      position: sticky;
      top: 18px;
      display: grid;
      gap: 12px;
      padding: 14px;
      border: 1px solid rgba(225, 174, 45, 0.58);
      border-radius: 8px;
      background: rgba(19, 12, 7, 0.86);
      box-shadow: 0 16px 42px rgba(0, 0, 0, 0.32);
      color: #fff;
    }

    .student-menu-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      color: #e1ae2d;
      font-size: 0.82rem;
      font-weight: 950;
      letter-spacing: 0;
    }

    .student-class-badge {
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(225, 174, 45, 0.4);
      padding: 2px 7px;
      color: #fff;
      font-size: 0.72rem;
    }

    .student-main {
      min-width: 0;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 340px;
      gap: 16px;
      align-items: start;
    }

    .student-content {
      min-width: 0;
      display: grid;
      gap: 16px;
    }

    .credit-pill {
      min-height: 36px;
      border-color: rgba(231, 189, 73, 0.42);
      background: rgba(255, 255, 255, 0.1);
      padding: 7px 10px;
    }

    .student-tools {
      display: grid;
      gap: 9px;
      align-items: stretch;
    }

    .student-tools .credit-pill {
      justify-content: space-between;
      width: 100%;
    }

    .student-tools button {
      width: 100%;
      justify-content: center;
    }

    .ethics-quiz-tile {
      min-height: 86px;
      display: grid;
      place-items: center;
      gap: 4px;
      border: 1px solid rgba(231, 189, 73, 0.62);
      border-radius: 8px;
      background:
        linear-gradient(180deg, rgba(255, 248, 225, 0.16), rgba(185, 31, 31, 0.16)),
        rgba(255, 255, 255, 0.08);
      color: #fff;
      text-decoration: none;
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.08);
      transition: transform 0.16s ease, border-color 0.16s ease, background 0.16s ease, box-shadow 0.16s ease;
    }

    .ethics-quiz-tile:hover,
    .ethics-quiz-tile:focus-visible {
      border-color: #e1ae2d;
      background:
        linear-gradient(180deg, rgba(255, 248, 225, 0.24), rgba(185, 31, 31, 0.22)),
        rgba(255, 255, 255, 0.12);
      box-shadow: 0 0 0 3px rgba(225, 174, 45, 0.18);
      outline: none;
      transform: translateY(-1px);
    }

    .ethics-quiz-mark {
      width: 42px;
      height: 42px;
      display: grid;
      place-items: center;
      border-radius: 8px;
      background: #fffaf0;
      color: #9d1f1b;
      font-size: 1.65rem;
      line-height: 1;
      font-weight: 950;
      box-shadow: 0 8px 18px rgba(0, 0, 0, 0.18);
    }

    .ethics-quiz-label {
      color: #fff;
      font-size: 0.95rem;
      line-height: 1.2;
      font-weight: 950;
    }

    .ethics-picker-form {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 7px;
      align-items: end;
      padding: 9px;
      border: 1px solid rgba(231, 189, 73, 0.42);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.08);
    }

    .ethics-picker-field {
      min-width: 0;
      display: grid;
      gap: 5px;
      color: rgba(255, 255, 255, 0.78);
      font-size: 0.78rem;
      font-weight: 950;
    }

    .ethics-picker-field:first-child {
      grid-column: 1 / -1;
    }

    .ethics-picker-input {
      min-width: 0;
      min-height: 38px;
      border: 1px solid rgba(231, 189, 73, 0.42);
      border-radius: 7px;
      background: #fffaf0;
      color: #24180f;
      padding: 8px 9px;
      font: inherit;
      font-weight: 950;
    }

    .status-ok {

    .status-bad {

    .chat-card,

      background: #fffaf0;
    }

    .chat-input {

      min-height: 40px;
      border: 1px solid #d6c49b;

      background: #fff;
      color: #18202b;
      padding: 8px 10px;

    .token-counter {

      font-weight: 950;

    .token-counter.is-warn {

      color: #a31616;
    }

    .chat-input:focus,
    .note-area:focus {

    }

    .send-btn {
      min-width: 58px;
      min-height: 40px;
      border-radius: 7px;
      background: #2a1e13;
      color: #fff;
      padding: 8px 12px;
      font-weight: 950;
      grid-area: button;
      align-self: stretch;
    }

    .send-btn:hover,
    .send-btn:focus-visible {
      background: #8f1717;
      outline: none;
    }

    .note-card {
      padding: 12px;
    }

    .note-area {
      min-height: 132px;
      margin-top: 9px;
      border-color: #d6c49b;
    }

    .case-note-card {
      position: sticky;
      top: 18px;
    }

    .case-note-card .note-area {
      min-height: 420px;
    }

    .similarity-submit-box {
      display: grid;
      gap: 8px;
      margin-top: 12px;
      border: 1px solid #d6c49b;
      border-radius: 8px;
      background: #fffaf0;
      padding: 10px;
    }

    .similarity-submit-box label {
      color: #5a321c;
      font-size: 0.86rem;
      font-weight: 950;
    }

    .similarity-submit-input {
      width: 100%;
      min-height: 78px;
      resize: vertical;

      border-radius: 7px;
      background: #fff;
      color: #24180f;
      padding: 9px 10px;
      font: inherit;
      line-height: 1.45;
      font-weight: 780;
    }

    .similarity-submit-input:focus {
      border-color: #b91f1f;
      box-shadow: 0 0 0 3px rgba(185, 31, 31, 0.12);

    }

    .similarity-submit-actions {

      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;

    .similarity-submit-count,
    .similarity-submit-status {
      color: #6b563a;

      font-weight: 850;
    }

    .similarity-submit-status {
      min-height: 20px;
    }

    .similarity-submit-status.is-ok {
      color: #116c46;
    }

    .similarity-submit-status.is-bad {
      color: #b3221d;
    }

    .similarity-submit-count.is-bad {
      color: #b3221d;
    }

    .evidence-vault-card {
      border: 1px solid rgba(255, 255, 255, 0.62);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.96);
      box-shadow: 0 14px 34px rgba(0, 0, 0, 0.22);
      overflow: hidden;
    }

    .evidence-vault-layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(300px, 0.52fr);
      gap: 10px;
      padding: 12px;
      background: #fffaf0;
    }

    .evidence-board {
      min-width: 0;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 10px;
      align-content: start;
    }

    .evidence-board-card {
      min-width: 0;
      display: grid;
      grid-template-columns: 92px minmax(0, 1fr);
      gap: 10px;
      align-items: center;
      border: 1px solid #e4d8bd;
      border-radius: 8px;
      background: #fff;
      padding: 8px;
      text-align: left;
      cursor: pointer;
    }

    .evidence-board-card:hover,
    .evidence-board-card:focus-visible,
    .evidence-board-card.is-active {
      border-color: #a31616;
      box-shadow: 0 0 0 3px rgba(163, 22, 22, 0.12);
      outline: none;
    }

    .evidence-board-thumb {
      width: 92px;
      aspect-ratio: 1 / 0.82;
      object-fit: cover;
      border-radius: 7px;
      background: #16110d;
    }

    .evidence-board-body {
      min-width: 0;
      display: grid;
      gap: 5px;
    }

    .evidence-board-body span {
      color: #8f1717;
      font-size: 0.76rem;
      font-weight: 950;
    }

    .evidence-board-body strong {
      color: #2a1e13;
      font-size: 0.94rem;
      line-height: 1.28;
      font-weight: 950;
      word-break: keep-all;
    }

    .evidence-board-body em {
      color: #116c46;
      font-size: 0.78rem;
      line-height: 1.25;
      font-style: normal;
      font-weight: 950;
    }

    .evidence-board-empty {
      margin: 0;
      color: #786850;
      font-weight: 850;
    }

    .evidence-room-detail {
      min-width: 0;
      display: grid;
      gap: 10px;
      align-content: start;
      border: 1px solid #e4d8bd;
      border-radius: 8px;
      background: #fff;
      padding: 10px;
    }

    .evidence-room-empty {
      margin: 0;
      color: #786850;
      font-size: 0.9rem;
      line-height: 1.45;
      font-weight: 850;
      word-break: keep-all;
    }

    .evidence-room-hero {
      display: grid;
      gap: 8px;
    }

    .evidence-room-hero img {
      display: block;
      width: 100%;
      aspect-ratio: 16 / 9;
      object-fit: contain;
      border-radius: 8px;
      background: #16110d;
      border: 1px solid #e4d8bd;
    }

    .evidence-room-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .evidence-room-title h3 {
      margin: 0;
      color: #2a1e13;
      font-size: 1.02rem;
      line-height: 1.2;
      font-weight: 950;
    }

    .evidence-room-title span {
      flex: 0 0 auto;
      color: #8f1717;
      font-size: 0.82rem;
      font-weight: 950;
    }

    .evidence-room-list {
      display: grid;
      gap: 8px;
    }

    .evidence-room-card {
      display: grid;
      grid-template-columns: 84px minmax(0, 1fr);
      gap: 9px;
      align-items: center;
      border: 1px solid #eadfc7;
      border-radius: 8px;
      background: #fffaf0;
      padding: 8px;
    }

    .evidence-room-card img {
      display: block;
      width: 84px;
      aspect-ratio: 1 / 0.78;
      object-fit: cover;
      border-radius: 7px;
      background: #16110d;
    }

    .evidence-room-card span {
      display: block;
      color: #8f1717;
      font-size: 0.74rem;
      font-weight: 950;
    }

    .evidence-room-card strong {
      display: block;
      margin-top: 4px;
      color: #2a1e13;
      font-size: 0.9rem;
      line-height: 1.28;
      font-weight: 950;
      word-break: keep-all;
    }

    .evidence-room-card em {
      display: block;
      margin-top: 4px;
      color: #116c46;
      font-size: 0.78rem;
      line-height: 1.25;
      font-style: normal;
      font-weight: 950;
    }

    .footer-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 14px;
      margin-top: 16px;
    }

    .student-log-head .presence-refresh-btn {
      min-width: 170px;
    }

    .student-log-card {
      padding: 0;
    }

    .footer-grid .student-log-card {
      margin-top: 0;
    }

    .student-log-list,
    .presence-list {
      display: grid;
      gap: 8px;
      max-height: 230px;
      overflow-y: auto;
      padding: 12px;
      background: #fffaf0;
    }

    .student-log-entry,
    .presence-row {
      border-color: #e4d8bd;
      background: #fff;
    }

    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    @media (max-width: 1180px) {
      .student-workspace {
        grid-template-columns: 1fr;
      }

      .student-main {
        grid-template-columns: 1fr;
      }

      .case-note-card {
        position: static;
      }

      .student-menu {
        position: static;
      }

      .student-tools {
        grid-template-columns: repeat(4, minmax(0, 1fr));
      }

      .ethics-quiz-tile,
      .ethics-picker-form,
      .ethics-reset-btn,
      .ethics-solved-summary {
        grid-column: 1 / -1;
      }

      .student-tools button {
        min-width: 0;
      }

      .suspect-grid {
        grid-template-columns: 1fr;
      }

      .evidence-vault-layout {
        grid-template-columns: 1fr;
      }

      .suspect-column {
        grid-template-columns: minmax(220px, 0.7fr) minmax(0, 1fr);
        align-items: start;
      }

      .suspect-card {
        grid-column: 1;
      }

      .chat-card {
        grid-column: 2;
        grid-row: 1;
        grid-template-rows: auto minmax(360px, 48vh) auto;
      }

      .suspect-card img {
        max-height: 100%;
      }
    }

    @media (max-width: 760px) {
      .page {
        padding: 12px;
      }

      .topbar {
        align-items: flex-start;
        flex-direction: column;
      }

      .student-tools {
        grid-template-columns: 1fr;
      }

      .suspect-column,
      .footer-grid {
        grid-template-columns: 1fr;
      }

      .chat-card,
      .suspect-card,
      .note-card {
        grid-column: auto;
        grid-row: auto;
      }

      .chat-card {
        grid-template-rows: auto minmax(300px, 44vh) auto;
      }

      .suspect-card img {
        max-height: none;
      }

      .card-lightbox {
        padding: 12px;

      .card-lightbox__image {
        max-width: calc(100vw - 24px);

<body data-auth="student">
  <main class="page">
    <header class="topbar">
      <h1>AI 페르소나 심문실</h1>
    </header>

    <div class="student-workspace">
      <aside class="student-menu" aria-label="질문권 메뉴">
        <strong class="student-menu-title">MENU <span class="student-class-badge" data-class-label>1반</span></strong>
        <div class="student-tools">
          <div class="credit-pill" aria-label="남은 질문권">
            <span data-team-label>학생</span>
            <strong data-credit-count>확인 중</strong>
          </div>
          <div class="credit-pill" aria-label="사용한 질문권">
            <span>사용</span>
            <strong data-log-count>0회</strong>
          </div>
          <div class="credit-pill" aria-label="AI 연결 상태">
            <span>AI</span>
            <strong data-api-status>확인 중</strong>
          </div>
          <div class="credit-pill" aria-label="접속 중 계정">
            <span>접속</span>
            <strong data-presence-count>0명</strong>
          </div>
          <form class="evidence-code-form" data-evidence-form>
            <label class="visually-hidden" for="studentEvidenceCode">증거 코드 입력</label>
            <input class="evidence-code-input" id="studentEvidenceCode" data-evidence-code type="text" autocomplete="off" maxlength="12" placeholder="증거 코드">
            <button class="receive-credit-btn" type="submit" data-evidence-submit>입력</button>
          </form>
          <p class="evidence-code-message" data-evidence-message></p>
          <div class="presence-menu">
            <div class="presence-menu-row">
              <button class="presence-refresh-btn" type="button" data-refresh-presence data-toggle-presence aria-expanded="false" aria-controls="studentPresencePanel">접속 중 인원 보기</button>
              <span class="presence-menu-count" data-presence-count>0명</span>
            </div>
            <div class="presence-menu-panel" id="studentPresencePanel" data-presence-panel hidden>
              <div class="presence-list presence-list--menu" data-presence-list></div>
            </div>
          </div>
          <button class="ethics-quiz-tile" type="button" data-student-ethics-open aria-controls="studentEthicsCard">
            <span class="ethics-quiz-mark" aria-hidden="true">?</span>
            <span class="ethics-quiz-label">윤리퀴즈</span>
          </button>
          <form class="ethics-picker-form" data-student-ethics-form>
            <label class="ethics-picker-field" for="studentEthicsPassword">
              윤리퀴즈 비밀번호
              <input class="ethics-picker-input" id="studentEthicsPassword" data-student-ethics-password type="password" autocomplete="off" placeholder="비밀번호 입력">
            </label>
            <label class="ethics-picker-field" for="studentEthicsNumber">
              문제 번호
              <input class="ethics-picker-input" id="studentEthicsNumber" data-student-ethics-number type="text" inputmode="numeric" placeholder="1" readonly>
            </label>
            <button class="ethics-picker-submit" type="submit">시작</button>
          </form>
          <div class="ethics-solved-summary" data-student-ethics-solved>푼 문제: 없음</div>
          <button class="ethics-reset-btn" type="button" data-student-ethics-reset>푼 문제 초기화</button>
          <button class="receive-credit-btn" type="button" data-refresh-credits>질문권 받기</button>
          <button class="logout-btn" type="button" data-logout>로그아웃</button>
        </div>
      </aside>

      <div class="student-main">
        <div class="student-content">
        <section class="suspect-grid" aria-label="용의자 심문">
          <article class="suspect-column" data-suspect-panel data-suspect="kangWoojin" data-suspect-name="강우진">
            <figure class="suspect-card">
              <img src="assets/suspect-card-kang.png" alt="강우진 용의자 카드">
            </figure>

        <section class="chat-card" aria-label="강우진 심문">
          <div class="chat-head">
            <h2>강우진</h2>
            <span class="chat-state" data-chat-state>대기</span>
          </div>
          <div class="messages" data-chat-messages aria-live="polite"></div>
          <form class="chat-form" data-chat-form>
            <label class="visually-hidden" for="chatKangWoojin">강우진 질문 입력</label>
            <input class="chat-input" id="chatKangWoojin" type="text" autocomplete="off" data-chat-input placeholder="강우진에게 질문하기">
            <button class="send-btn" type="submit" data-chat-submit>전송</button>
          </form>
        </section>
      </article>

      <article class="suspect-column" data-suspect-panel data-suspect="seoHarin" data-suspect-name="서하린">
        <figure class="suspect-card">
          <img src="assets/suspect-card-harin.png" alt="서하린 용의자 카드">
        </figure>

        <section class="chat-card" aria-label="서하린 심문">
          <div class="chat-head">
            <h2>서하린</h2>
            <span class="chat-state" data-chat-state>대기</span>
          </div>
          <div class="messages" data-chat-messages aria-live="polite"></div>
          <form class="chat-form" data-chat-form>
            <label class="visually-hidden" for="chatSeoHarin">서하린 질문 입력</label>
            <input class="chat-input" id="chatSeoHarin" type="text" autocomplete="off" data-chat-input placeholder="서하린에게 질문하기">
            <button class="send-btn" type="submit" data-chat-submit>전송</button>
          </form>
        </section>
      </article>

      <article class="suspect-column" data-suspect-panel data-suspect="choiDaniel" data-suspect-name="최다니엘">
        <figure class="suspect-card">
          <img src="assets/suspect-card-daniel.png" alt="최다니엘 용의자 카드">
        </figure>

        <section class="chat-card" aria-label="최다니엘 심문">
          <div class="chat-head">
            <h2>최다니엘</h2>
            <span class="chat-state" data-chat-state>대기</span>
          </div>
          <div class="messages" data-chat-messages aria-live="polite"></div>
          <form class="chat-form" data-chat-form>
            <label class="visually-hidden" for="chatChoiDaniel">최다니엘 질문 입력</label>
            <input class="chat-input" id="chatChoiDaniel" type="text" autocomplete="off" data-chat-input placeholder="최다니엘에게 질문하기">
            <button class="send-btn" type="submit" data-chat-submit>전송</button>
          </form>
        </section>
      </article>
    </section>

        <section class="student-ethics-card" id="studentEthicsCard" data-student-ethics-card hidden aria-live="polite"></section>

        <section class="evidence-vault-card" aria-label="획득한 증거카드">
          <div class="student-log-head">
            <h2>획득한 증거카드</h2>
            <strong data-evidence-board-count>0개</strong>
          </div>
          <div class="evidence-vault-layout">
            <div class="evidence-board" data-evidence-board></div>
            <aside class="evidence-room-detail" data-evidence-room-detail aria-live="polite">
              <p class="evidence-room-empty">증거카드를 누르면 교실 사진과 해당 교실에서 얻은 증거만 표시됩니다.</p>
            </aside>
          </div>
        </section>
        </div>

        <aside class="note-card case-note-card" aria-label="심문 노트">
          <h3>심문 노트</h3>
          <textarea class="note-area" data-note-key="case" placeholder="심문 내용을 자유롭게 정리하세요."></textarea>
          <div class="note-tools">
            <span data-note-status="case">자동 저장</span>
            <button class="clear-note" type="button" data-clear-note="case">비우기</button>
          </div>
          <form class="similarity-submit-box" data-similarity-form>
            <label for="similaritySentence">유사도 측정 문장 보내기</label>
            <textarea class="similarity-submit-input" id="similaritySentence" data-similarity-sentence maxlength="500" placeholder="선생님에게 보낼 최종 문장을 500자 안으로 입력하세요."></textarea>
            <div class="similarity-submit-actions">
              <span class="similarity-submit-count" data-similarity-count>0/500</span>
              <button class="clear-note" type="submit" data-similarity-submit>전송</button>
            </div>
            <p class="similarity-submit-status" data-similarity-status></p>
          </form>
        </aside>
      </div>
    </div>
  </main>
  <div class="card-lightbox" data-card-lightbox hidden role="dialog" aria-modal="true" aria-label="Suspect card">
    <button class="card-lightbox__close" type="button" data-close-card aria-label="Close">X</button>
    <img class="card-lightbox__image" data-card-lightbox-image alt="">
  </div>
</body>
</html>
