<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>기티 목소리 샘플</title>
  <script src="auth.js?v=account-teacher-1" defer></script>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at 18% 10%, rgba(215, 166, 95, 0.22), transparent 28%),
        linear-gradient(135deg, #0d1522 0%, #172235 54%, #202436 100%);
      color: #fff8eb;
      font-family: "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
      letter-spacing: 0;
    }

    button,
    textarea {
      font: inherit;
    }

    button {
      border: 0;
      cursor: pointer;
    }

    .page {
      width: min(100%, 1180px);
      margin: 0 auto;
      padding: 24px;
    }

    .hero,
    .sample-panel {
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 8px;
      background: rgba(14, 24, 38, 0.9);
      box-shadow: 0 18px 50px rgba(0, 0, 0, 0.28);
    }

    .hero {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 160px;
      gap: 18px;
      align-items: center;
      overflow: hidden;
      padding: 22px;
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      min-height: 34px;
      margin-bottom: 14px;
      border: 1px solid rgba(255, 248, 235, 0.24);
      border-radius: 7px;
      background: rgba(255, 255, 255, 0.08);
      color: #fff8eb;
      padding: 7px 10px;
      text-decoration: none;
      font-weight: 900;
    }

    h1 {
      margin: 0 0 8px;
      color: #fff;
      font-size: clamp(2rem, 4vw, 3.4rem);
      line-height: 1.05;
      font-weight: 950;
    }

    .hero p {
      margin: 0;
      color: rgba(255, 248, 235, 0.76);
      font-weight: 820;
      line-height: 1.55;
      word-break: keep-all;
    }

    .hero img {
      width: 170px;
      height: 170px;
      object-fit: contain;
      filter: drop-shadow(0 16px 22px rgba(0, 0, 0, 0.32));
    }

    .sample-panel {
      margin-top: 18px;
      padding: 18px;
    }

    .sample-panel h2 {
      margin: 0 0 10px;
      color: #fff;
      font-size: 1.24rem;
      font-weight: 950;
    }

    .sample-text {
      width: 100%;
      min-height: 112px;
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.96);
      color: #18202b;
      padding: 12px;
      line-height: 1.55;
      font-weight: 780;
      resize: vertical;
    }

    .voice-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
      margin-top: 16px;
    }

    .voice-card {
      min-height: 96px;
      display: grid;
      gap: 6px;
      align-content: start;
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.07);
      color: #fff8eb;
      padding: 12px;
      text-align: left;
      transition: transform 0.18s ease, border-color 0.18s ease, background 0.18s ease;
    }

    .voice-card:hover,
    .voice-card:focus-visible,
    .voice-card.is-playing {
      border-color: rgba(255, 220, 167, 0.7);
      background: rgba(255, 220, 167, 0.13);
      outline: none;
      transform: translateY(-1px);
    }

    .voice-card strong {
      color: #ffdca7;
      font-size: 1.08rem;
      font-weight: 950;
    }

    .voice-card span {
      color: rgba(255, 248, 235, 0.72);
      font-size: 0.86rem;
      line-height: 1.38;
      font-weight: 760;
    }

    .status {
      min-height: 24px;
      margin: 14px 0 0;
      color: #ffdca7;
      font-weight: 900;
    }

    .hint {
      margin: 12px 0 0;
      color: rgba(255, 248, 235, 0.68);
      line-height: 1.5;
      font-size: 0.9rem;
      font-weight: 760;
      word-break: keep-all;
    }

    @media (max-width: 840px) {
      .hero {
        grid-template-columns: 1fr;
      }

      .hero img {
        width: 128px;
        height: 128px;
      }

      .voice-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 460px) {
      .page {
        padding: 14px;
      }

      .voice-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
  <link rel="stylesheet" href="kit-ui-polish.css?v=20260725-ui1">
</head>
<body data-auth="teacher">
  <main class="page">
    <header class="hero">
      <div>
        <a class="back-link" href="case-note-similarity.html">유사도 화면으로</a>
        <h1>기티 목소리 샘플</h1>
        <p>같은 대사를 여러 OpenAI TTS voice로 들어보고, 기티에게 가장 잘 어울리는 목소리를 고르세요.</p>
      </div>
      <img src="assets/characters/detective-note-mascot.png" alt="" aria-hidden="true">
    </header>

    <section class="sample-panel" aria-label="기티 목소리 샘플">
      <h2>샘플 대사</h2>
      <textarea class="sample-text" data-sample-text>잠깐, 탐정의 눈으로 다시 볼까요? 1팀은 유사도 94퍼센트예요. 범인 지목과 AI 입력, 그리고 유출 경로까지 꽤 정확하게 잡았어요. 하지만 증거의 연결 과정을 조금 더 또렷하게 말하면 완벽에 가까워질 거예요.</textarea>
      <div class="voice-grid" data-voice-grid></div>
      <p class="status" data-status>원하는 voice를 눌러 들어보세요.</p>
      <p class="hint">음성 생성은 OpenAI API를 사용하므로 버튼을 누를 때마다 소량의 비용이 발생합니다. 같은 목소리를 여러 번 비교할 때는 짧은 문장으로 테스트하세요.</p>
    </section>
  </main>

  <script>
    (function () {
      const voices = [
        ["alloy", "균형 잡힌 기본형"],
        ["ash", "차분하고 선명한 톤"],
        ["ballad", "부드럽고 이야기하는 느낌"],
        ["coral", "밝고 캐릭터감 있는 톤"],
        ["echo", "또렷한 안내자 톤"],
        ["fable", "스토리텔러 느낌"],
        ["nova", "밝고 현대적인 톤"],
        ["onyx", "낮고 묵직한 톤"],
        ["sage", "차분한 설명자 톤"],
        ["shimmer", "맑고 가벼운 톤"],
        ["verse", "표현력 있는 톤"],
        ["marin", "부드럽고 따뜻한 톤"],
        ["cedar", "안정적인 저음 톤"]
      ];

      const grid = document.querySelector("[data-voice-grid]");
      const textInput = document.querySelector("[data-sample-text]");
      const status = document.querySelector("[data-status]");
      let audio = null;
      let audioUrl = "";
      let requestId = 0;

      function setStatus(text) {
        if (status) status.textContent = text;
      }

      function stopAudio() {
        requestId += 1;
        if (audio) {
          audio.pause();
          audio.src = "";
        }
        if (audioUrl) URL.revokeObjectURL(audioUrl);
        audio = null;
        audioUrl = "";
        document.querySelectorAll(".voice-card").forEach((button) => button.classList.remove("is-playing"));
      }

      async function playVoice(voice, button) {
        if (button.classList.contains("is-playing")) {
          stopAudio();
          setStatus(`${voice} 재생을 멈췄습니다.`);
          return;
        }

        stopAudio();
        const currentRequest = requestId + 1;
        requestId = currentRequest;
        button.classList.add("is-playing");
        setStatus(`${voice} 목소리를 만들고 있습니다...`);

        try {
          const response = await fetch("/api/tts", {
            method: "POST",
            headers: {
              "content-type": "application/json; charset=utf-8",
              "x-kit-role": "teacher"
            },
            body: JSON.stringify({
              role: "teacher",
              voice,
              text: textInput.value
            })
          });

          if (!response.ok) {
            const message = await response.text().catch(() => "");
            throw new Error(message || "음성 생성 실패");
          }

          const blob = await response.blob();
          if (requestId !== currentRequest) return;
          audioUrl = URL.createObjectURL(blob);
          audio = new Audio(audioUrl);
          audio.onended = () => {
            if (requestId === currentRequest) {
              stopAudio();
              setStatus(`${voice} 샘플 재생이 끝났습니다.`);
            }
          };
          audio.onerror = () => {
            if (requestId === currentRequest) {
              stopAudio();
              setStatus(`${voice} 샘플을 재생하지 못했습니다.`);
            }
          };
          await audio.play();
          setStatus(`${voice} 샘플을 재생 중입니다.`);
        } catch (error) {
          if (requestId !== currentRequest) return;
          stopAudio();
          setStatus("샘플을 만들지 못했습니다. Vercel 배포 URL에서 열었는지, OPENAI_API_KEY가 설정되어 있는지 확인하세요.");
        }
      }

      grid.innerHTML = voices.map(([voice, description]) => `
        <button class="voice-card" type="button" data-voice="${voice}">
          <strong>${voice}</strong>
          <span>${description}</span>
        </button>
      `).join("");

      grid.addEventListener("click", (event) => {
        const button = event.target.closest("[data-voice]");
        if (!button) return;
        playVoice(button.dataset.voice, button);
      });
    })();
  </script>
</body>
</html>
