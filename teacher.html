<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>키트 중학교 미니게임 지도</title>
  <script src="auth.js" defer></script>
  <link rel="stylesheet" href="clock.css">
  <style>
    :root {
      --bg: #101826;
      --panel: rgba(255, 255, 255, 0.94);
      --panel-strong: #ffffff;
      --ink: #18202b;
      --muted: #657181;
      --line: rgba(255, 255, 255, 0.18);
      --red: #f3342f;
      --red-soft: rgba(243, 52, 47, 0.14);
      --blue: #2f6eea;
      --green: #148a5b;
      --gold: #b06f14;
      --violet: #7652d6;
      --shadow: 0 18px 50px rgba(0, 0, 0, 0.32);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at 18% 10%, rgba(64, 104, 170, 0.28), transparent 30%),
        linear-gradient(135deg, #0d1522 0%, #172235 52%, #202436 100%);
      color: var(--ink);
      font-family: "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
      letter-spacing: 0;
    }

    button {
      border: 0;
      font: inherit;
      cursor: pointer;
    }

    .auth-tools {
      position: fixed;
      z-index: 10;
      right: 22px;
      bottom: 22px;
      display: flex;
      align-items: center;
      gap: 8px;
      border: 1px solid rgba(255, 255, 255, 0.62);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.94);
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.22);
      padding: 8px;
      color: #344154;
      font-weight: 900;
    }

    .auth-tools button {
      min-height: 32px;
      border-radius: 6px;
      background: #1d2a3d;
      color: #fff;
      padding: 6px 10px;
      font-weight: 900;
    }

    .page {
      min-height: 100vh;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 340px;
      gap: 22px;
      align-items: start;
      padding: 22px;
    }

    .map-panel {
      min-width: 0;
    }

    .map-title {
      display: none;
      width: min(100%, 1360px);
      margin: 0 auto 14px;
      color: #fff;
      align-items: end;
      justify-content: space-between;
      gap: 16px;
    }

    .map-title h1 {
      margin: 0;
      font-size: 1.6rem;
      line-height: 1.2;
      font-weight: 900;
    }

    .map-title p {
      margin: 0;
      color: rgba(255, 255, 255, 0.72);
      font-weight: 700;
    }

    .map-frame {
      position: relative;
      width: min(100%, 1360px);
      margin: 0 auto;
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
      overflow: hidden;
      background: #0f1724;
    }

    .school-map {
      display: block;
      width: 100%;
      height: auto;
      user-select: none;
      -webkit-user-drag: none;
    }

    .school-name-overlay {
      position: absolute;
      z-index: 2;
      pointer-events: none;
      color: #f5f7fb;
      font-weight: 900;
      letter-spacing: 0;
      text-shadow:
        0 2px 0 rgba(0, 0, 0, 0.72),
        0 0 10px rgba(0, 0, 0, 0.62);
      white-space: nowrap;
    }

    .school-name-overlay--title {
      left: 1.18%;
      top: 2.08%;
      padding: 3px 10px 5px 0;
      background: rgba(14, 25, 39, 0.86);
      font-size: clamp(1.05rem, 2.25vw, 2rem);
      line-height: 1.1;
    }

    .school-name-overlay--sign {
      left: 81.92%;
      top: 12.75%;
      min-width: 11.4%;
      padding: 5px 8px 6px;
      border-radius: 3px;
      background: rgba(10, 21, 33, 0.91);
      font-size: clamp(0.62rem, 1.22vw, 1.08rem);
      line-height: 1;
      text-align: center;
    }

    .hotspot {
      position: absolute;
      left: var(--x);
      top: var(--y);
      width: var(--w);
      height: var(--h);
      border: 3px solid rgba(243, 52, 47, 0.9);
      border-radius: 4px;
      background: rgba(243, 52, 47, 0.03);
      box-shadow:
        0 0 0 1px rgba(255, 226, 224, 0.55) inset,
        0 0 16px rgba(243, 52, 47, 0.28);
      transition: background 0.18s ease, box-shadow 0.18s ease, transform 0.18s ease;
    }

    .hotspot:hover,
    .hotspot:focus-visible {
      background: var(--red-soft);
      box-shadow:
        0 0 0 1px rgba(255, 255, 255, 0.74) inset,
        0 0 24px rgba(243, 52, 47, 0.58);
      outline: none;
      transform: translateY(-1px);
    }

    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .suspect-strip {
      width: min(100%, 1360px);
      margin: 18px auto 0;
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 16px;
    }

    .suspect-link {
      display: grid;
      grid-template-columns: 108px minmax(0, 1fr);
      gap: 14px;
      align-items: center;
      min-height: 138px;
      padding: 12px;
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 8px;
      background: rgba(14, 24, 38, 0.9);
      color: #f7f9fc;
      text-decoration: none;
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.26);
      transition: transform 0.18s ease, border-color 0.18s ease, box-shadow 0.18s ease;
    }

    .suspect-link:hover,
    .suspect-link:focus-visible {
      border-color: rgba(243, 52, 47, 0.78);
      box-shadow: 0 0 0 1px rgba(243, 52, 47, 0.28), 0 16px 34px rgba(0, 0, 0, 0.32);
      outline: none;
      transform: translateY(-2px);
    }

    .suspect-photo {
      width: 108px;
      aspect-ratio: 4 / 5;
      border-radius: 7px;
      overflow: hidden;
      background: #111827;
      border: 1px solid rgba(255, 255, 255, 0.16);
    }

    .suspect-photo img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .suspect-info {
      min-width: 0;
    }

    .suspect-info h2 {
      margin: 0 0 7px;
      font-size: clamp(1.08rem, 1.45vw, 1.45rem);
      line-height: 1.2;
      color: #fff;
    }

    .suspect-info p {
      margin: 0;
      color: rgba(247, 249, 252, 0.72);
      font-size: 0.92rem;
      line-height: 1.45;
      word-break: keep-all;
    }

    .score-board {
      position: sticky;
      top: 22px;
      max-height: calc(100vh - 44px);
      overflow-y: auto;
      background: var(--panel);
      border: 1px solid rgba(255, 255, 255, 0.62);
      border-radius: 8px;
      box-shadow: var(--shadow);
      padding: 16px;
      backdrop-filter: blur(12px);
    }

    .score-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 14px;
    }

    .score-head h2 {
      margin: 0;
      font-size: 1.12rem;
      line-height: 1.2;
    }

    .score-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .score-sync-status {
      min-height: 20px;
      margin: -4px 0 12px;
      color: var(--muted);
      font-size: 0.82rem;
      line-height: 1.35;
      font-weight: 900;
    }

    .score-sync-status--ok {
      color: var(--green);
    }

    .score-sync-status--bad {
      color: var(--red);
    }

    .presence-panel {
      margin-bottom: 14px;
      border: 1px solid #e1e6ee;
      border-radius: 8px;
      background: var(--panel-strong);
      padding: 12px;
    }

    .presence-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 10px;
    }

    .presence-head h3 {
      margin: 0;
      color: #344154;
      font-size: 0.96rem;
      line-height: 1.2;
    }

    .presence-head strong {
      color: var(--green);
      font-size: 0.94rem;
      font-weight: 950;
    }

    .presence-actions {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
      flex-wrap: wrap;
    }

    .presence-refresh-btn {
      min-height: 30px;
      padding: 6px 8px;
      font-size: 0.76rem;
      white-space: nowrap;
    }

    .presence-refresh-btn:disabled {
      cursor: wait;
      opacity: 0.62;
    }

    .presence-list {
      display: grid;
      gap: 7px;
    }

    .presence-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      min-height: 34px;
      border: 1px solid #e6edf5;
      border-radius: 7px;
      background: #f6f8fb;
      padding: 7px 8px;
      color: #18202b;
      font-weight: 950;
    }

    .presence-name {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .presence-role {
      flex: 0 0 auto;
      border-radius: 999px;
      background: #e9eef5;
      color: #516071;
      padding: 3px 7px;
      font-size: 0.74rem;
      font-weight: 950;
    }

    .presence-empty {
      margin: 0;
      color: var(--muted);
      font-size: 0.86rem;
      line-height: 1.4;
      font-weight: 850;
    }

    .reset-btn {
      min-height: 34px;
      border-radius: 6px;
      padding: 7px 10px;
      background: #eef1f5;
      color: #3a4553;
      font-weight: 800;
      white-space: nowrap;
    }

    #publishScores {
      background: var(--red);
      color: #fff;
      box-shadow: 0 10px 22px rgba(243, 52, 47, 0.2);
    }

    #publishScores:hover,
    #publishScores:focus-visible {
      background: #c92521;
    }

    .reset-btn:hover,
    .reset-btn:focus-visible {
      background: #dfe5ed;
      outline: none;
    }

    .team-list {
      display: grid;
      gap: 10px;
    }

    .team-row {
      display: grid;
      grid-template-columns: 36px 1fr;
      gap: 10px;
      align-items: center;
      min-height: 52px;
      padding: 9px;
      border: 1px solid #e1e6ee;
      border-radius: 8px;
      background: var(--panel-strong);
    }

    .team-badge {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      color: #fff;
      font-weight: 900;
    }

    .team-a {
      background: var(--blue);
    }

    .team-b {
      background: var(--green);
    }

    .team-c {
      background: var(--gold);
    }

    .team-d {
      background: var(--violet);
    }

    .team-score {
      min-width: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .team-name {
      display: block;
      color: var(--muted);
      font-weight: 700;
    }

    .score-input-wrap {
      display: flex;
      align-items: center;
      gap: 6px;
      color: #344154;
      font-weight: 900;
    }

    .score-input {
      width: 86px;
      min-height: 38px;
      border: 1px solid #d7dee8;
      border-radius: 6px;
      background: #f9fbfd;
      color: #18202b;
      padding: 8px 10px;
      text-align: right;
      font-weight: 900;
      font: inherit;
    }

    .score-input:focus {
      border-color: var(--red);
      box-shadow: 0 0 0 3px rgba(243, 52, 47, 0.14);
      outline: none;
    }

    .log-panel {
      margin-top: 14px;
      border: 1px solid #e1e6ee;
      border-radius: 8px;
      background: var(--panel-strong);
      padding: 12px;
    }

    .log-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 10px;
    }

    .log-head h3 {
      margin: 0;
      color: #344154;
      font-size: 0.96rem;
      line-height: 1.2;
    }

    .usage-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 7px;
      margin-bottom: 12px;
    }

    .usage-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      min-height: 34px;
      border-radius: 7px;
      background: #f6f8fb;
      border: 1px solid #e6edf5;
      padding: 7px 8px;
      color: #5b6878;
      font-size: 0.84rem;
      font-weight: 900;
    }

    .usage-row strong {
      color: #18202b;
      font-variant-numeric: tabular-nums;
    }

    .log-list {
      display: grid;
      gap: 7px;
      max-height: 210px;
      overflow-y: auto;
      padding-right: 2px;
    }

    .log-entry {
      border-radius: 7px;
      background: #fbfdff;
      border: 1px solid #e6edf5;
      padding: 8px;
    }

    .log-entry__meta {
      color: #657181;
      font-size: 0.76rem;
      font-weight: 900;
    }

    .log-entry p,
    .log-empty {
      margin: 4px 0 0;
      color: #18202b;
      font-size: 0.82rem;
      line-height: 1.38;
      font-weight: 800;
      word-break: keep-all;
    }

    .log-empty {
      margin: 0;
      color: var(--muted);
    }

    .time-tools {
      display: grid;
      gap: 12px;
      margin-top: 14px;
    }

    .time-tool {
      border: 1px solid #e1e6ee;
      border-radius: 8px;
      background: var(--panel-strong);
      padding: 12px;
    }

    .time-tool h3 {
      margin: 0;
      color: #344154;
      font-size: 0.95rem;
      line-height: 1.2;
    }

    .time-display {
      margin-top: 8px;
      color: #18202b;
      font-size: 1.65rem;
      line-height: 1;
      font-weight: 900;
      text-align: center;
      font-variant-numeric: tabular-nums;
    }

    .time-actions,
    .timer-inputs {
      display: flex;
      gap: 8px;
      margin-top: 10px;
    }

    .time-actions button {
      flex: 1;
      min-height: 36px;
      border-radius: 6px;
      background: #1d2a3d;
      color: #fff;
      font-weight: 900;
    }

    .time-actions button:hover,
    .time-actions button:focus-visible {
      background: var(--red);
      outline: none;
    }

    .timer-inputs {
      align-items: center;
      color: #657181;
      font-size: 0.86rem;
      font-weight: 800;
    }

    .timer-inputs input {
      width: 68px;
      min-height: 36px;
      border: 1px solid #d7dee8;
      border-radius: 6px;
      background: #f9fbfd;
      color: #18202b;
      padding: 7px 8px;
      text-align: right;
      font: inherit;
      font-weight: 900;
    }

    .timer-inputs input:focus {
      border-color: var(--red);
      box-shadow: 0 0 0 3px rgba(243, 52, 47, 0.14);
      outline: none;
    }

    @media (max-width: 1060px) {
      .page {
        grid-template-columns: 1fr;
      }

      .score-board {
        position: static;
        width: min(100%, 1360px);
        margin: 0 auto;
        order: -1;
      }

      .team-list {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .suspect-strip {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 640px) {
      .page {
        padding: 14px;
        gap: 14px;
      }

      .map-title {
        align-items: start;
        flex-direction: column;
      }

      .map-title h1 {
        font-size: 1.3rem;
      }

      .team-list {
        grid-template-columns: 1fr;
      }

      .hotspot {
        border-width: 2px;
      }

      .suspect-link {
        grid-template-columns: 86px minmax(0, 1fr);
        min-height: 112px;
      }

      .suspect-photo {
        width: 86px;
      }
    }
  </style>
</head>
<body data-auth="teacher">
  <div class="auth-tools">
    <span data-auth-label>선생용</span>
    <button type="button" data-logout>로그아웃</button>
  </div>
  <main class="page">
    <section class="map-panel" aria-label="학교 미니게임 지도">
      <div class="map-title">
        <h1>키트 중학교</h1>
        <p>5개의 미션 교실</p>
      </div>

      <div class="map-frame">
        <img class="school-map" src="assets/학교사진.jpg" alt="키트중학교 단면 지도">

        <a class="hotspot" style="--x: 79.59%; --y: 13.42%; --w: 12.70%; --h: 18.43%;" href="game-office.html" aria-label="교무실로 이동">
          <span class="visually-hidden">교무실</span>
        </a>

        <a class="hotspot" style="--x: 10.35%; --y: 32.20%; --w: 12.30%; --h: 18.07%;" href="game-art.html" aria-label="미술실로 이동">
          <span class="visually-hidden">미술실</span>
        </a>

        <a class="hotspot" style="--x: 57.03%; --y: 32.02%; --w: 7.42%; --h: 18.43%;" href="game-broadcast.html" aria-label="방송실로 이동">
          <span class="visually-hidden">방송실</span>
        </a>

        <a class="hotspot" style="--x: 10.35%; --y: 50.98%; --w: 24.80%; --h: 13.77%;" href="game-science.html" aria-label="과학실로 이동">
          <span class="visually-hidden">과학실</span>
        </a>

        <a class="hotspot" style="--x: 64.75%; --y: 69.59%; --w: 27.44%; --h: 18.78%;" href="game-gym.html" aria-label="체육관으로 이동">
          <span class="visually-hidden">체육관</span>
        </a>
      </div>

      <div class="suspect-strip" aria-label="용의자 선택">
        <a class="suspect-link" href="teacherroom.html" aria-label="강우진 조사 화면으로 이동">
          <div class="suspect-photo">
            <img src="assets/characters/kang-woojin.png" alt="축구부 학생 강우진">
          </div>
          <div class="suspect-info">
            <h2>강우진</h2>
            <p>축구부 소속. 운동장에 자주 보이는 활발한 학생.</p>
          </div>
        </a>

        <a class="suspect-link" href="harinroom.html" aria-label="서하린 조사 화면으로 이동">
          <div class="suspect-photo">
            <img src="assets/characters/ai-tech-girl.png" alt="AI와 컴퓨터를 잘 다루는 서하린">
          </div>
          <div class="suspect-info">
            <h2>서하린</h2>
            <p>차분하고 꼼꼼한 성격. 컴퓨터 사용에 익숙한 학생.</p>
          </div>
        </a>

        <a class="suspect-link" href="danielroom.html" aria-label="최다니엘 조사 화면으로 이동">
          <div class="suspect-photo">
            <img src="assets/characters/alibi-black-boy.png" alt="교무실 근처에서 목격된 최다니엘">
          </div>
          <div class="suspect-info">
            <h2>최다니엘</h2>
            <p>조용하고 성실한 편. 복도와 체육관 근처에서 자주 보이는 학생.</p>
          </div>
        </a>
      </div>
    </section>

    <aside class="score-board" aria-label="학생별 질문권">
      <div class="clock-card" aria-label="현재 시간">
        <div class="analog-clock" data-clock>
          <div class="analog-clock__face">
            <div class="analog-clock__hand analog-clock__hand--hour"></div>
            <div class="analog-clock__hand analog-clock__hand--minute"></div>
            <div class="analog-clock__hand analog-clock__hand--second"></div>
            <div class="analog-clock__center"></div>
          </div>
          <div class="analog-clock__time" data-clock-time>00:00:00</div>
        </div>
      </div>

      <section class="presence-panel" aria-label="접속 중 계정">
        <div class="presence-head">
          <h3>접속 중 계정</h3>
          <div class="presence-actions">
            <strong data-presence-count>0명</strong>
            <button class="reset-btn presence-refresh-btn" type="button" data-refresh-presence>접속중 인원 보기</button>
          </div>
        </div>
        <div class="presence-list" data-presence-list></div>
      </section>

      <div class="score-head">
        <h2>학생별 질문권</h2>
        <div class="score-actions">
          <button class="reset-btn" type="button" id="publishScores">질문권 주기</button>
          <button class="reset-btn" type="button" id="resetScores">질문권 초기화</button>
        </div>
      </div>

      <div class="team-list">
        <div class="team-row">
          <div class="team-badge team-a">승</div>
          <div class="team-score">
