<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>선생님 교무실 증거 조사</title>
  <script src="auth.js" defer></script>
  <script src="token-estimator.js" defer></script>
  <link rel="stylesheet" href="room-investigation.css">
  <script src="room-investigation.js" defer></script>
  <script src="teacher-sounds.js" defer></script>
</head>
<body class="room-page" data-auth="teacher" data-room-id="office" data-room-name="교무실">
  <main class="room-shell">
    <section class="room-main">
      <header class="room-topbar">
        <div class="room-title">
          <p>AI 수사단 증거 조사</p>
          <h1>교무실</h1>
        </div>
        <a class="back-link" href="teacher.html">교사 지도로</a>
      </header>

      <section class="scene-frame" aria-label="교무실 증거 사진">
        <img class="room-image" src="assets/evidence-rooms/office-masked.png" alt="교무실 증거 2개가 표시된 사진">
      </section>

      <section class="evidence-panel" aria-label="교무실 증거 카드">
        <h2>증거 카드</h2>
        <div class="evidence-grid">
          <article class="evidence-card">
            <img class="evidence-card__image" src="assets/evidence-cards/office-tablet-cctv.png" alt="CCTV에 찍힌 강우진의 태블릿 증거 이미지">
            <span>증거 1</span>
            <strong>CCTV에 찍힌 강우진의 태블릿</strong>
          </article>
          <article class="evidence-card">
            <span>증거 2</span>
            <strong>책상 위 기말고사 문제지</strong>
          </article>
        </div>
      </section>
    </section>

    <aside class="interrogation-panel" aria-label="AI 심문">
      <div class="side-head">
        <h2>AI 심문</h2>
        <button class="logout-btn" type="button" data-logout>로그아웃</button>
      </div>

      <section class="side-section" aria-label="질문권 상태">
        <div class="status-grid">
          <div class="status-pill"><span data-team-label>학생</span><strong data-credit-count>확인 중</strong></div>
          <div class="status-pill"><span>사용</span><strong data-log-count>0회</strong></div>
          <div class="status-pill"><span>AI</span><strong data-api-status>확인 중</strong></div>
          <div class="status-pill"><span>장소</span><strong data-room-label>교무실</strong></div>
        </div>
      </section>

      <section class="side-section" aria-label="증거 코드 입력">
        <h2>증거 코드</h2>
        <form class="code-form" data-evidence-form>
          <label class="visually-hidden" for="evidenceCode">증거 코드 입력</label>
          <input class="code-input" id="evidenceCode" data-evidence-code type="text" autocomplete="off" maxlength="12" placeholder="증거 코드 입력">
          <button class="primary-btn" type="submit">확인</button>
        </form>
        <p class="code-message" data-evidence-message></p>
      </section>

      <section class="chat-card" aria-label="선택 인물 심문">
        <div class="chat-head">
          <label class="visually-hidden" for="suspectSelect">심문 대상</label>
          <select class="suspect-select" id="suspectSelect" data-suspect-select>
            <option value="kangWoojin">강우진</option>
            <option value="seoHarin">서하린</option>
            <option value="choiDaniel">최다니엘</option>
          </select>
          <div class="chat-meta"><span data-chat-state>대기</span></div>
        </div>
        <div class="messages" data-chat-messages aria-live="polite"></div>
        <form class="chat-form" data-chat-form>
          <label class="visually-hidden" for="chatInput">질문 입력</label>
          <input class="chat-input" id="chatInput" data-chat-input type="text" autocomplete="off" placeholder="질문권 확인 중">
          <button class="send-btn" type="submit" data-chat-submit>전송</button>
        </form>
      </section>
    </aside>
  </main>

  <script type="application/json" data-room-evidence>
    [
      { "index": 1, "name": "CCTV에 찍힌 강우진의 태블릿" },
      { "index": 2, "name": "책상 위 기말고사 문제지" }
    ]
  </script>
</body>
</html>
