<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>한국 중학교 미니게임 지도</title>
  <style>
    :root {
      --bg: #101826;
      --panel: rgba(255, 255, 255, 0.94);
      --panel-strong: #ffffff;
      --ink: #18202b;
      --muted: #657181;
      --line: rgba(255, 255, 255, 0.18);
      --red: #f3342f;
      --red-soft: rgba(243, 52, 47, 0.14);
      --blue: #2f6eea;
      --green: #148a5b;
      --gold: #b06f14;
      --violet: #7652d6;
      --shadow: 0 18px 50px rgba(0, 0, 0, 0.32);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at 18% 10%, rgba(64, 104, 170, 0.28), transparent 30%),
        linear-gradient(135deg, #0d1522 0%, #172235 52%, #202436 100%);
      color: var(--ink);
      font-family: "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
      letter-spacing: 0;
    }

    button {
      border: 0;
      font: inherit;
      cursor: pointer;
    }

    .page {
      min-height: 100vh;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 292px;
      gap: 22px;
      align-items: start;
      padding: 22px;
    }

    .map-panel {
      min-width: 0;
    }

    .map-title {
      width: min(100%, 1360px);
      margin: 0 auto 14px;
      color: #fff;
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 16px;
    }

    .map-title h1 {
      margin: 0;
      font-size: 1.6rem;
      line-height: 1.2;
      font-weight: 900;
    }

    .map-title p {
      margin: 0;
      color: rgba(255, 255, 255, 0.72);
      font-weight: 700;
    }

    .map-frame {
      position: relative;
      width: min(100%, 1360px);
      margin: 0 auto;
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
      overflow: hidden;
      background: #0f1724;
    }

    .school-map {
      display: block;
      width: 100%;
      height: auto;
      user-select: none;
      -webkit-user-drag: none;
    }

    .hotspot {
      position: absolute;
      left: var(--x);
      top: var(--y);
      width: var(--w);
      height: var(--h);
      border: 3px solid rgba(243, 52, 47, 0.9);
      border-radius: 4px;
      background: rgba(243, 52, 47, 0.03);
      box-shadow:
        0 0 0 1px rgba(255, 226, 224, 0.55) inset,
        0 0 16px rgba(243, 52, 47, 0.28);
      transition: background 0.18s ease, box-shadow 0.18s ease, transform 0.18s ease;
    }

    .hotspot:hover,
    .hotspot:focus-visible {
      background: var(--red-soft);
      box-shadow:
        0 0 0 1px rgba(255, 255, 255, 0.74) inset,
        0 0 24px rgba(243, 52, 47, 0.58);
      outline: none;
      transform: translateY(-1px);
    }

    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .score-board {
      position: sticky;
      top: 22px;
      background: var(--panel);
      border: 1px solid rgba(255, 255, 255, 0.62);
      border-radius: 8px;
      box-shadow: var(--shadow);
      padding: 16px;
      backdrop-filter: blur(12px);
    }

    .score-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 14px;
    }

    .score-head h2 {
      margin: 0;
      font-size: 1.12rem;
      line-height: 1.2;
    }

    .reset-btn {
      min-height: 34px;
      border-radius: 6px;
      padding: 7px 10px;
      background: #eef1f5;
      color: #3a4553;
      font-weight: 800;
    }

    .reset-btn:hover,
    .reset-btn:focus-visible {
      background: #dfe5ed;
      outline: none;
    }

    .team-list {
      display: grid;
      gap: 10px;
    }

    .team-row {
      display: grid;
      grid-template-columns: 36px 1fr auto;
      gap: 10px;
      align-items: center;
      min-height: 52px;
      padding: 9px;
      border: 1px solid #e1e6ee;
      border-radius: 8px;
      background: var(--panel-strong);
    }

    .team-badge {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      color: #fff;
      font-weight: 900;
    }

    .team-a {
      background: var(--blue);
    }

    .team-b {
      background: var(--green);
    }

    .team-c {
      background: var(--gold);
    }

    .team-d {
      background: var(--violet);
    }

    .team-score {
      min-width: 0;
    }

    .team-score strong {
      display: block;
      font-size: 1.08rem;
      line-height: 1.1;
    }

    .team-score span {
      color: var(--muted);
      font-size: 0.83rem;
      font-weight: 700;
    }

    .score-actions {
      display: flex;
      gap: 6px;
    }

    .score-btn {
      min-width: 42px;
      min-height: 34px;
      border-radius: 6px;
      background: #1d2a3d;
      color: #fff;
      font-weight: 900;
    }

    .score-btn:hover,
    .score-btn:focus-visible {
      background: var(--red);
      outline: none;
    }

    @media (max-width: 1060px) {
      .page {
        grid-template-columns: 1fr;
      }

      .score-board {
        position: static;
        width: min(100%, 1360px);
        margin: 0 auto;
        order: -1;
      }

      .team-list {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 640px) {
      .page {
        padding: 14px;
        gap: 14px;
      }

      .map-title {
        align-items: start;
        flex-direction: column;
      }

      .map-title h1 {
        font-size: 1.3rem;
      }

      .team-list {
        grid-template-columns: 1fr;
      }

      .hotspot {
        border-width: 2px;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="map-panel" aria-label="학교 미니게임 지도">
      <div class="map-title">
        <h1>한국 중학교</h1>
        <p>4개의 미션 교실</p>
      </div>

      <div class="map-frame">
        <img class="school-map" src="assets/교실-단면-사진.png" alt="한국 중학교 단면도">

        <a class="hotspot" style="--x: 79.45%; --y: 13.54%; --w: 12.52%; --h: 17.72%;" href="game-staff.html" aria-label="교무실 미니게임으로 이동">
          <span class="visually-hidden">교무실</span>
        </a>

        <a class="hotspot" style="--x: 35.62%; --y: 32.36%; --w: 22.90%; --h: 18.03%;" href="game-library.html" aria-label="도서관 미니게임으로 이동">
          <span class="visually-hidden">도서관</span>
        </a>

        <a class="hotspot" style="--x: 10.58%; --y: 51.24%; --w: 24.75%; --h: 18.16%;" href="game-science.html" aria-label="과학실 미니게임으로 이동">
          <span class="visually-hidden">과학실</span>
        </a>

        <a class="hotspot" style="--x: 10.55%; --y: 70.38%; --w: 18.25%; --h: 17.12%;" href="game-entrance.html" aria-label="출입문 미니게임으로 이동">
          <span class="visually-hidden">출입문</span>
        </a>
      </div>
    </section>

    <aside class="score-board" aria-label="조별 점수판">
      <div class="score-head">
        <h2>조별 점수</h2>
        <button class="reset-btn" type="button" id="resetScores">초기화</button>
      </div>

      <div class="team-list">
        <div class="team-row">
          <div class="team-badge team-a">A</div>
          <div class="team-score">
            <strong><span id="scoreA">0</span>점</strong>
            <span>A조</span>
          </div>
          <div class="score-actions">
            <button class="score-btn" type="button" data-team="A" data-point="1" aria-label="A조 1점 올리기">+1</button>
            <button class="score-btn" type="button" data-team="A" data-point="5" aria-label="A조 5점 올리기">+5</button>
          </div>
        </div>

        <div class="team-row">
          <div class="team-badge team-b">B</div>
          <div class="team-score">
            <strong><span id="scoreB">0</span>점</strong>
            <span>B조</span>
          </div>
          <div class="score-actions">
            <button class="score-btn" type="button" data-team="B" data-point="1" aria-label="B조 1점 올리기">+1</button>
            <button class="score-btn" type="button" data-team="B" data-point="5" aria-label="B조 5점 올리기">+5</button>
          </div>
        </div>

        <div class="team-row">
          <div class="team-badge team-c">C</div>
          <div class="team-score">
            <strong><span id="scoreC">0</span>점</strong>
            <span>C조</span>
          </div>
          <div class="score-actions">
            <button class="score-btn" type="button" data-team="C" data-point="1" aria-label="C조 1점 올리기">+1</button>
            <button class="score-btn" type="button" data-team="C" data-point="5" aria-label="C조 5점 올리기">+5</button>
          </div>
        </div>

        <div class="team-row">
          <div class="team-badge team-d">D</div>
          <div class="team-score">
            <strong><span id="scoreD">0</span>점</strong>
            <span>D조</span>
          </div>
          <div class="score-actions">
            <button class="score-btn" type="button" data-team="D" data-point="1" aria-label="D조 1점 올리기">+1</button>
            <button class="score-btn" type="button" data-team="D" data-point="5" aria-label="D조 5점 올리기">+5</button>
          </div>
        </div>
      </div>
    </aside>
  </main>

  <script>
    const scoreKey = "korea-middle-school-team-scores";
    const baseScores = { A: 0, B: 0, C: 0, D: 0 };
    let scores = loadScores();

    function loadScores() {
      try {
        return { ...baseScores, ...JSON.parse(localStorage.getItem(scoreKey)) };
      } catch {
        return { ...baseScores };
      }
    }

    function saveScores() {
      localStorage.setItem(scoreKey, JSON.stringify(scores));
    }

    function renderScores() {
      Object.keys(baseScores).forEach((team) => {
        document.getElementById(`score${team}`).textContent = scores[team];
      });
    }

    document.querySelectorAll("[data-team][data-point]").forEach((button) => {
      button.addEventListener("click", () => {
        const team = button.dataset.team;
        const point = Number(button.dataset.point);
        scores[team] += point;
        saveScores();
        renderScores();
      });
    });

    document.getElementById("resetScores").addEventListener("click", () => {
      scores = { ...baseScores };
      saveScores();
      renderScores();
    });

    renderScores();
  </script>
</body>
</html>
