<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>사건노트 최종 유사도 측정</title>
  <script src="auth.js" defer></script>
  <link rel="stylesheet" href="case-note-similarity.css">
  <script src="case-note-similarity.js" defer></script>
</head>
<body data-auth="teacher">
  <div class="auth-tools">
    <span data-auth-label>선생님</span>
    <button type="button" data-logout>로그아웃</button>
  </div>

  <main class="page">
    <header class="hero">
      <div class="hero__copy">
        <a class="back-link" href="teacher.html">교사용 화면</a>
        <h1>사건노트 최종 유사도 측정</h1>
        <p>각 팀의 최종 추리노트를 기준 사건노트와 비교하고, 핵심 요소 충족률로 팀 순위를 계산합니다.</p>
      </div>
      <img class="hero__mascot" src="assets/characters/detective-note-mascot.png" alt="" aria-hidden="true">
    </header>

    <section class="standard-note" aria-label="기준 사건노트">
      <details>
        <summary>기준 사건노트 보기</summary>
        <p data-standard-note></p>
      </details>
    </section>

    <section class="rubric-panel" aria-label="유사도 판정 기준">
      <h2>판정 기준</h2>
      <div class="rubric-grid" data-rubric-list></div>
    </section>

    <section class="workspace">
      <section class="input-panel" aria-label="팀별 사건노트 입력">
        <div class="panel-head">
          <div>
            <h2>팀 사건노트 입력</h2>
            <p>팀 이름과 최종 추리노트를 입력한 뒤 유사도 측정을 누르세요.</p>
          </div>
          <div class="team-count-control">
            <label for="teamCount">팀 수</label>
            <input id="teamCount" type="number" min="1" max="30" step="1" value="4" data-team-count>
            <button type="button" data-apply-team-count>적용</button>
          </div>
        </div>

        <div class="toolbar">
          <button class="primary-btn" type="button" data-score-all>유사도 측정</button>
          <button type="button" data-add-team>팀 추가</button>
          <button type="button" data-export-csv>CSV 저장</button>
          <button class="danger-btn" type="button" data-reset-all>전체 초기화</button>
        </div>

        <div class="team-list" data-team-list></div>
      </section>

      <aside class="ranking-panel" aria-label="팀 순위">
        <div class="ranking-summary">
          <h2>팀 순위</h2>
          <div class="summary-stats">
            <strong data-team-total>0팀</strong>
            <span>평균 <b data-average-score>0%</b></span>
          </div>
        </div>
        <ol class="ranking-list" data-ranking-list></ol>
      </aside>

      <aside class="report-panel" aria-label="유사도 측정 리포트">
        <div class="report-head">
          <img src="assets/characters/detective-note-mascot.png" alt="" aria-hidden="true">
          <div>
            <h2>유사도 측정 리포트</h2>
            <p data-report-status>유사도 측정 후 팀별 판정 근거를 정리합니다.</p>
          </div>
        </div>
        <div class="report-list" data-report-list></div>
      </aside>
    </section>
  </main>
</body>
</html>
